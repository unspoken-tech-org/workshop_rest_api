services:
  caddy-gateway-qa:
    build:
      context: ./platform/gateway/caddy
      dockerfile: Dockerfile
    image: workshop/caddy-gateway-qa:latest
    container_name: caddy-gateway-qa
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    environment:
      # Tracing (snippet api_proxy do Caddyfile): OTLP/HTTP ao Collector da homologação, pela rede
      # workshop-metrics. Sem o Collector a requisição segue; só o span se perde.
      - OTEL_SERVICE_NAME=caddy-gateway
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-qa-api:4318
    volumes:
      - ./platform/gateway/caddy/Caddyfile-gateway-qa:/etc/caddy/Caddyfile
      - caddy_data_qa:/data
      - caddy_config_qa:/config
    # Token da Cloudflare (desafio DNS) e e-mail do ACME como arquivo, fora do env do container;
    # o Caddyfile os lê por {file./run/secrets/...}.
    secrets:
      - cf_api_token
      - admin_email
    networks:
      - workshop-ingress
      - workshop-metrics
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - cloudflared-qa

  cloudflared-qa:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-gateway-qa
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - workshop-ingress

secrets:
  cf_api_token:
    file: ./secrets/cf_api_token
  admin_email:
    file: ./secrets/admin_email

volumes:
  caddy_data_qa:
  caddy_config_qa:

networks:
  workshop-ingress:
    name: workshop-ingress
    driver: bridge
  # Rede interna criada pelo Compose da API de QA; o Caddy só envia traces ao Collector.
  workshop-metrics:
    name: workshop-metrics
    external: true

services:
  caddy-gateway-qa:
    build:
      context: ./platform/gateway/caddy
      dockerfile: Dockerfile
    image: workshop/caddy-gateway-qa:latest
    container_name: caddy-gateway-qa
    restart: always
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    environment:
      # Tracing (snippet api_proxy do Caddyfile): OTLP/HTTP ao Collector da homologação, pela rede
      # workshop-metrics. Sem o Collector a requisição segue; só o span se perde.
      - OTEL_SERVICE_NAME=caddy-gateway
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-qa-api:4318
    volumes:
      # :ro: root no container não pode reescrever o Caddyfile do host (WAF e rate limit).
      - ./platform/gateway/caddy/Caddyfile-gateway-qa:/etc/caddy/Caddyfile:ro
      - caddy_data_qa:/data
      - caddy_config_qa:/config
    # Token da Cloudflare (desafio DNS) e e-mail do ACME como arquivo, fora do env do container;
    # o Caddyfile os lê por {file./run/secrets/...}.
    secrets:
      - cf_api_token
      - admin_email
    networks:
      - workshop-ingress
      # Proxy até a API (workshop-api:8080); rede interna só de Caddy e API.
      - workshop-app
      - workshop-metrics
    # Hardening de runtime: o Caddy recebe a entrada não confiável (Tunnel e LAN).
    # Sem capabilities além de NET_BIND_SERVICE (portas 80 e 443), sem escalada por
    # setuid e com o sistema de arquivos somente leitura; /data e /config são volumes.
    read_only: true
    # O Coraza leva para /tmp os corpos acima de 128 KiB (até 1 MB pelo request_body).
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - cloudflared-qa

  cloudflared-qa:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: cloudflared-gateway-qa
    restart: unless-stopped
    # Métricas só no loopback do container: o healthcheck usa o endpoint /ready, que
    # responde 200 apenas com o tunnel conectado à borda da Cloudflare (R2).
    # O token chega como arquivo, fora do comando e do env do container.
    command: tunnel --metrics 127.0.0.1:2000 run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - workshop-ingress
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 128
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  cf_api_token:
    file: ./secrets/cf_api_token
  admin_email:
    file: ./secrets/admin_email
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

volumes:
  caddy_data_qa:
  caddy_config_qa:

networks:
  # Somente cloudflared e Caddy: a API não entra aqui.
  workshop-ingress:
    name: workshop-ingress
    driver: bridge
  # Caddy -> API, sem saída. Declarada também no compose da API, com a mesma
  # configuração: quem subir primeiro cria a rede.
  workshop-app:
    name: workshop-app
    driver: bridge
    internal: true
  # Rede interna criada pelo Compose da API de QA; o Caddy envia traces ao
  # Collector e expõe /metrics na porta 9180 (sem publicação no host) ao scrape interno.
  workshop-metrics:
    name: workshop-metrics
    external: true

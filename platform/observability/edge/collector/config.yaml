# Collector de borda da VM de produção (projeto Compose workshop-edge). Faz o
# scrape autenticado da API de PRD, mede a si mesmo e recebe OTLP do próprio
# projeto (nenhum produtor ainda). Tudo sai por um único exporter OTLP/gRPC para
# o Collector interno da QA, com fila persistente em disco: a fila absorve a
# indisponibilidade da QA (meta de 4 horas) e sobrevive a reinícios do container.
#
# Todo dado que passa por aqui é de produção: o ambiente é reescrito pela origem
# confiável. A redaction repete a do Collector interno da QA como defesa em
# profundidade; a API continua sendo a barreira principal.

extensions:
  # Lido pelo probe sidecar do Compose (a imagem é distroless).
  health_check:
    endpoint: 0.0.0.0:13133

  # Volume próprio (edge_collector_queue). Cada sinal grava seu arquivo bbolt; a
  # compactação devolve espaço depois da drenagem.
  file_storage/queue:
    directory: /var/lib/otelcol/file_storage
    compaction:
      directory: /var/lib/otelcol/file_storage
      on_start: true
      on_rebound: true
      cleanup_on_start: true

receivers:
  # Scrape autenticado de /actuator/prometheus com a identidade de leitura
  # mínima da API. A senha vem de secret montado em arquivo, nunca desta
  # configuração.
  prometheus/api:
    config:
      scrape_configs:
        - job_name: workshop-api
          scrape_interval: 15s
          scrape_timeout: 10s
          metrics_path: /actuator/prometheus
          basic_auth:
            username: ${env:API_SCRAPE_USERNAME}
            password_file: /run/secrets/api_scrape_password
          static_configs:
            - targets:
                - ${env:API_SCRAPE_TARGET}

  # Telemetria do próprio Collector: fila, envios, falhas e descartes. Como passa
  # pela mesma fila, esses contadores também são reenviados após uma queda da QA.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector-edge
          scrape_interval: 15s
          static_configs:
            - targets:
                - localhost:8888

  # OTLP do próprio projeto, sem produtores ainda: o Java Agent e o Alloy entram
  # nas fases seguintes. Os endpoints escutam em 0.0.0.0 dentro do container, por
  # isso o alcance real é o conjunto de redes anexadas a este serviço; por isso
  # não há porta publicada no host.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Container de 256 MiB: limite de 192 MiB e pico de 48 MiB. O restante cobre o
  # processo, o mmap do bbolt e os buffers gRPC.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48

  # Mesma lista do Collector interno da QA (defesa em profundidade).
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: x-api-key
        action: delete
      - key: api-key
        action: delete
      - key: password
        action: delete
      - key: passwd
        action: delete
      - key: secret
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: client_secret
        action: delete
      # Headers HTTP: allowlist vazia no primeiro corte.
      - pattern: ^http\.(request|response)\.header\..*
        action: delete
      # Statements SQL, URLs e caminhos concretos; http.route é preservada.
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: db.connection_string
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: url.path
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: enduser.id
        action: delete
      - key: enduser.email
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

  # service.instance.id é preservado no recurso (identificador técnico efêmero).
  resource/redact:
    attributes:
      - key: host.ip
        action: delete
      - key: host.mac
        action: delete
      - key: process.command_line
        action: delete
      # Java 9+: o agent emite os argumentos da JVM neste atributo.
      - key: process.command_args
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

  # Origem confiável: tudo que sai deste Collector é produção.
  resource/production:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      # Atributo depreciado (R16).
      - key: deployment.environment
        action: delete
      - key: service.namespace
        value: workshop
        action: upsert

  # Política de dados: service.instance.id nunca vira label de métrica (no
  # Prometheus da QA ele viraria o label "instance").
  resource/metrics-labels:
    attributes:
      - key: service.instance.id
        action: delete

  # Só a série up do scrape da API segue para o endpoint de saúde (scrape-health).
  # Esse endpoint é interno, mas as redes do projeto o alcançam; por isso não pode
  # expor as métricas autenticadas da API.
  filter/scrape-health:
    error_mode: ignore
    metric_conditions:
      - 'metric.name != "up"'

exporters:
  # Único destino: o Collector interno da QA, no IP Tailscale informado no deploy
  # (QA_OTLP_ENDPOINT). Sem TLS porque o transporte é o túnel WireGuard do
  # Tailscale; a restrição de origem (somente a VM de PRD) fica na ACL do tailnet,
  # adiada para o fim do plano por decisão do responsável. Até lá não há
  # credencial extra.
  otlp_grpc/qa:
    endpoint: ${env:QA_OTLP_ENDPOINT}
    tls:
      insecure: true
    timeout: 10s
    # Fila persistente com limite em bytes (COLLECTOR_QUEUE_BYTES), cheia a
    # recusa chega ao receiver em vez de descarte silencioso depois do aceite.
    # Dimensionamento: 6 MB/h com todos os sinais (taxa de referência do plano);
    # 4 horas somam ~24 MB. Há uma fila por sinal, cada uma com 64 MiB (192 MiB
    # no pior caso de disco): mais de 2× a janela, mesmo com um sinal só.
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: ${env:COLLECTOR_QUEUE_BYTES}
      # Lote montado na saída da fila, não por processor (mesma razão da QA).
      batch:
        flush_timeout: 5s
        sizer: items
        min_size: 512
        max_size: 1024
    # Sem prazo de retry: o limite é o disco, não o tempo. Após 4 horas a
    # tentativa continua, sem promessa de retenção além da janela validada.
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

  # Endpoint interno de saúde do scrape, lido por verify.sh a partir do probe
  # (edge-probe). Expõe só up{job="workshop-api"}; nenhuma porta é publicada no host.
  prometheus/scrape-health:
    endpoint: 0.0.0.0:8889

service:
  extensions:
    - health_check
    - file_storage/queue
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      # Interno ao container: sem porta publicada no host. O prometheus/self lê
      # por localhost.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - attributes/redact
      exporters:
        - otlp_grpc/qa
    metrics:
      receivers:
        - prometheus/api
        - prometheus/self
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - resource/metrics-labels
        - attributes/redact
      exporters:
        - otlp_grpc/qa
    metrics/scrape-health:
      receivers:
        - prometheus/api
      processors:
        - memory_limiter
        - filter/scrape-health
      exporters:
        - prometheus/scrape-health
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - attributes/redact
      exporters:
        - otlp_grpc/qa

# Collector de borda da VM de produção (PRD). Projeto Compose próprio, volume de
# fila próprio e nenhuma porta publicada no host. Faz o scrape autenticado da API
# de PRD, coleta métricas do host e dos containers, recebe OTLP do próprio projeto
# (hoje, o containers-collector) e envia tudo à QA pela rede privada (Tailscale), com
# fila persistente em disco. Ainda não implantado: a instalação em PRD é a Fase 1,
# item 11 do plano.
#
# Implantação, a partir da raiz da release (mesmo padrão da QA):
#   docker compose --project-directory . -p workshop-edge \
#     -f platform/observability/edge/compose.yml up -d --wait
# O nome do projeto também está fixado no arquivo (name:), para que um deploy
# sem -p não reutilize o projeto do ambiente local.
#
# Pré-requisitos:
#   - Rede workshop-metrics criada pelo Compose da API de PRD (interna); a API
#     precisa estar implantada antes, como na QA.
#   - Arquivo com a senha de scrape legível pelo UID 10001 da imagem; o deploy
#     o grava em .secrets/ da release (diretório 700, arquivo 444) e passa o
#     caminho em EDGE_API_SCRAPE_PASSWORD_FILE.
#
# Variáveis (ambiente do deploy):
#   QA_OTLP_ENDPOINT               IP Tailscale da QA com a porta, ex.: 100.x.y.z:4317
#   API_SCRAPE_TARGET              host:porta da API de PRD na rede workshop-metrics
#   API_SCRAPE_USERNAME            identidade de leitura mínima (padrão metrics-scraper)
#   EDGE_API_SCRAPE_PASSWORD_FILE  caminho do arquivo com a senha de scrape
#   EDGE_PG_MONITOR_PASSWORD_FILE  caminho do arquivo com a senha do papel workshop_metrics
#   COLLECTOR_QUEUE_BYTES          limite em bytes da fila de cada sinal (64 MiB)
#
# Redes: edge-otlp, edge-probe, edge-node, edge-docker, edge-docker-logs e edge-pg
# são internas e sem saída; edge-egress é a única saída, rumo à QA pela Tailscale;
# workshop-metrics é
# compartilhada com a API de PRD (scrape e traces) e com o gateway (traces), e workshop-db-metrics
# somente com o banco de PRD, para o postgres-exporter. A restrição de quem pode
# enviar à QA fica na ACL do tailnet (lado da QA).
#
# Host e containers: node-exporter (mesmos coletores da QA, para o dashboard Hosts)
# e containers-collector, que lê containers por docker-api-proxy (allowlist de rotas
# GET). Além do Alloy (abaixo), só o containers-collector alcança a API do Docker, e
# ele não tem rota para a internet: envia OTLP ao Collector de borda, que tem
# credenciais e saída, mas não tem acesso ao socket.
# Logs: Alloy, que lê o stdout da API e do gateway de PRD por docker-logs-proxy
# (allowlist por nome, só ping, versão, listas e inspect e logs desses dois
# containers) e envia OTLP ao Collector de borda pela edge-otlp, sem saída própria.
# Os dois proxies montam o socket, cada um na sua rede interna.
# PostgreSQL: postgres-exporter, com o papel workshop_metrics (pg_monitor). Alcança o
# banco pela rede interna workshop-db-metrics, que o deploy cria e conecta ao
# container workshop-db sem reiniciá-lo; o deploy também cria ou atualiza o papel.

name: workshop-edge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command:
      - --config=file:/etc/otelcol-contrib/config.yaml
    environment:
      QA_OTLP_ENDPOINT: ${QA_OTLP_ENDPOINT:?QA_OTLP_ENDPOINT is required}
      API_SCRAPE_TARGET: ${API_SCRAPE_TARGET:?API_SCRAPE_TARGET is required}
      API_SCRAPE_USERNAME: ${API_SCRAPE_USERNAME:-metrics-scraper}
      # Limite da fila persistente de cada sinal (64 MiB por padrão; 192 MiB nos
      # três sinais).
      COLLECTOR_QUEUE_BYTES: ${COLLECTOR_QUEUE_BYTES:-67108864}
    secrets:
      - api_scrape_password
    volumes:
      - ./platform/observability/edge/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - edge_collector_queue:/var/lib/otelcol/file_storage
    networks:
      # Ingresso OTLP do próprio projeto (containers-collector e Alloy).
      - edge-otlp
      - edge-probe
      # Saída para a QA.
      - edge-egress
      # Scrape de /actuator/prometheus e traces OTLP do Java Agent da API de PRD.
      - workshop-metrics
      # Scrape do node-exporter do próprio projeto. Não tem acesso à API do Docker:
      # ela fica só com containers-collector (ver abaixo).
      - edge-node
      # Scrape do postgres-exporter. O Collector não alcança o banco.
      - edge-pg
    # Sem depends_on do node-exporter: o Collector sobe sem ele. Se o node-exporter
    # falhar, o deploy reprova pela prontidão e pelo verify.sh (up{job="node-exporter"}).
    depends_on:
      otel-collector-queue-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sem healthcheck próprio (distroless): o deploy exige o probe saudável.
    labels:
      com.workshop.observability.readiness-probe: otel-collector-probe
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 96M

  # O volume nasce root; a imagem distroless roda como 10001. Execução única
  # (restart "no"): os scripts de deploy aceitam este serviço encerrado com 0.
  otel-collector-queue-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["chown", "10001:10001", "/var/lib/otelcol/file_storage"]
    volumes:
      - edge_collector_queue:/var/lib/otelcol/file_storage
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  otel-collector-probe:
    # Mesmo digest do busybox do queue-init acima e do SCRAPE_CHECK_IMAGE em deploy.sh: manter igual.
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sleep", "2147483647"]
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - edge-probe
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://otel-collector:13133/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M

  # Coletor de containers: o único com acesso à API do Docker (pela allowlist
  # docker-api-proxy). Não tem rota para a internet nem credenciais: envia OTLP ao
  # Collector de borda pela rede edge-otlp, e é esse Collector, com credenciais e
  # saída, que exporta à QA. Isso separa a leitura da API do Collector que guarda
  # credenciais. O inspect devolve Config.Env dos containers: risco aceito enquanto
  # os segredos da API e do banco não ficarem no env (ver docker-api-proxy). Probe
  # próprio, pelo mesmo motivo do Collector principal (distroless).
  containers-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command:
      - --config=file:/etc/otelcol-contrib/config.yaml
    volumes:
      - ./platform/observability/edge/containers-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - edge-docker
      - edge-otlp
    depends_on:
      docker-api-proxy:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Sem healthcheck próprio (distroless): o deploy exige o probe saudável.
    labels:
      com.workshop.observability.readiness-probe: containers-collector-probe
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  containers-collector-probe:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sleep", "2147483647"]
    depends_on:
      containers-collector:
        condition: service_started
    networks:
      - edge-otlp
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://containers-collector:13133/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M

  # Métricas do host com os mesmos coletores do node-exporter da QA, para que o
  # dashboard Hosts sirva aos dois ambientes (nomes node_*). Diferença da QA: o
  # container não publica porta e só entra na rede edge-node. O mount de / é
  # somente leitura, como na QA; o container roda como nobody (padrão da imagem).
  # /etc/hosts, /etc/hostname e /etc/resolv.conf são bind mounts do Docker no mesmo
  # disco do /: sem a exclusão abaixo, o disco aparece duplicado com esses nomes.
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/snap/.+|etc/(hosts|hostname|resolv\.conf))($$|/)
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.pressure
    volumes:
      - /:/host:ro,rslave
    networks:
      - edge-node
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # PostgreSQL de PRD com o papel workshop_metrics (pg_monitor, criado pelo deploy). Sem
  # as métricas padrão nem os coletores roles e stat_activity, que rotulam séries com
  # usuários, papéis e application_name; ficam banco, conexões, transações, locks,
  # WAL, arquivamento (pgBackRest) e settings. Conecta ao banco postgres: os coletores
  # usados leem visões do cluster. Só o exporter entra em workshop-db-metrics; o
  # Collector o raspa por edge-pg. Nenhuma das duas redes tem saída.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    command:
      - --disable-default-metrics
      - --no-collector.roles
      - --no-collector.stat_activity
    environment:
      DATA_SOURCE_URI: workshop-db:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: workshop_metrics
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_monitor_password
    secrets:
      - pg_monitor_password
    networks:
      - edge-pg
      - workshop-db-metrics
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:9187/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  # Via do containers-collector até a API do Docker, por allowlist de rotas (Caddy):
  # GET de /containers/json, /containers/{id}/json, /containers/{id}/stats, /events,
  # /version e /_ping; o resto recebe 403. O socket é montado só aqui e no
  # docker-logs-proxy (Alloy). O :ro do
  # bind não restringe a API (a restrição é a allowlist no Caddyfile). Sem porta
  # publicada: só a rede edge-docker. A imagem é a Caddy já fixada na plataforma.
  docker-api-proxy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    volumes:
      - ./platform/observability/edge/docker-api-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge-docker
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=8m,noexec,nosuid,nodev
      - /config:size=8m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # O binário traz a file capability cap_net_bind_service; sem ela no conjunto
    # permitido, o exec falha com no-new-privileges (como no Caddy da plataforma).
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

  # Logs da API e do gateway de PRD: lê o stdout dos dois containers pelo
  # docker-logs-proxy e envia por OTLP/HTTP ao Collector de borda (que carimba
  # production e exporta à QA pela fila persistente). Sem rota para a internet: só as
  # redes internas edge-docker-logs e edge-otlp. As posições de leitura ficam no
  # volume alloy_data, para um reinício não reenviar os logs já lidos; o diretório da
  # imagem já pertence ao usuário 473, que o volume novo herda. Mesma imagem e
  # limites do Alloy da QA.
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    user: "473:473"
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    volumes:
      - ./platform/observability/edge/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - edge-docker-logs
      - edge-otlp
    depends_on:
      docker-logs-proxy:
        condition: service_healthy
      otel-collector-probe:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /-/ready só responde 200 depois que todos os componentes carregaram.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Allowlist somente leitura da API do Docker para o Alloy
  # (docker-logs-proxy/Caddyfile), na rede interna edge-docker-logs. Separado do
  # docker-api-proxy: este libera logs de dois containers, aquele não libera logs.
  docker-logs-proxy:
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    volumes:
      - ./platform/observability/edge/docker-logs-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge-docker-logs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=8m,noexec,nosuid,nodev
      - /config:size=8m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # O binário traz a file capability cap_net_bind_service; sem ela no conjunto
    # permitido, o exec falha com no-new-privileges (como no Caddy da plataforma).
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

secrets:
  # Caminho absoluto fora da release, definido no ambiente do deploy.
  api_scrape_password:
    file: ${EDGE_API_SCRAPE_PASSWORD_FILE:?EDGE_API_SCRAPE_PASSWORD_FILE is required}
  # Senha do papel workshop_metrics; mesmo tratamento da senha de scrape.
  pg_monitor_password:
    file: ${EDGE_PG_MONITOR_PASSWORD_FILE:?EDGE_PG_MONITOR_PASSWORD_FILE is required}

networks:
  # OTLP do projeto: containers-collector e Alloy → Collector de borda; sem saída e
  # sem porta publicada.
  edge-otlp:
    driver: bridge
    internal: true
  # Somente probe ↔ Collector (healthcheck); sem saída.
  edge-probe:
    driver: bridge
    internal: true
  # Somente Collector ↔ node-exporter; sem saída.
  edge-node:
    driver: bridge
    internal: true
  # Somente containers-collector ↔ allowlist da API do Docker; sem saída.
  edge-docker:
    driver: bridge
    internal: true
  # Somente Alloy ↔ docker-logs-proxy; sem saída.
  edge-docker-logs:
    driver: bridge
    internal: true
  # Somente Collector ↔ postgres-exporter; sem saída.
  edge-pg:
    driver: bridge
    internal: true
  # Única saída do projeto: Collector → QA pelo IP Tailscale.
  edge-egress:
    driver: bridge
  # Criada pelo Compose da API de PRD (interna): scrape de /actuator/prometheus.
  # external: este projeto nunca cria nem remove a rede. Se o down do projeto da
  # API (dono da rede) rodar com a borda anexada, o Compose dele avisa "is still in
  # use and was left in place": é o comportamento esperado, não um erro.
  workshop-metrics:
    name: workshop-metrics
    external: true
  # Rede interna só do banco e do postgres-exporter. O deploy a cria e conecta o
  # workshop-db em tempo de execução (docker network connect, sem reinício); o Compose
  # da API não a declara, porque mudar as redes do banco ali o recriaria no próximo
  # deploy da API. Se o workshop-db for recriado, a conexão some até o próximo deploy
  # desta borda (alerta WorkshopPostgresDown).
  workshop-db-metrics:
    name: workshop-db-metrics
    external: true

volumes:
  alloy_data:
  edge_collector_queue:

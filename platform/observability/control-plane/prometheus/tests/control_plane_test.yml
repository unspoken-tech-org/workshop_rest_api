# Execução: promtool test rules tests/control_plane_test.yml
# (a partir de platform/observability/control-plane/prometheus). As regras
# herdadas do laboratório local são cobertas por local/prometheus/tests.
rule_files:
  - ../rules/observability.yml

evaluation_interval: 1m

tests:
  # Host e containers de PRD (jobs workshop/node-exporter e workshop/docker-stats).
  - name: métricas do host de PRD ausentes alertam após 5 minutos e voltam ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x3 _x37 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkshopHostMetricsAbsent
      - eval_time: 19m
        alertname: WorkshopHostMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/node-exporter
            exp_annotations:
              summary: "Métricas do host de PRD ausentes"
              description: "Nenhuma amostra do node-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."
      - eval_time: 44m
        alertname: WorkshopHostMetricsAbsent

  - name: host de PRD com métricas presentes não alerta ausência
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopHostMetricsAbsent

  - name: node-exporter de PRD fora do ar alerta após 5 minutos e volta ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopHostScrapeFailing
      - eval_time: 10m
        alertname: WorkshopHostScrapeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/node-exporter
            exp_annotations:
              summary: "Scrape do node-exporter de PRD falhando"
              description: "O Collector de borda não consegue raspar o node-exporter do host há mais de 5 minutos."
      - eval_time: 25m
        alertname: WorkshopHostScrapeFailing

  - name: disco do host de PRD abaixo de 30% livre alerta warning após 15 minutos
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '50x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: WorkshopHostFilesystemLow
      - eval_time: 17m
        alertname: WorkshopHostFilesystemLow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 30% livre"
              description: "O ponto de montagem / tem menos de 30% livre há mais de 15 minutos. Reveja retenção de backups e logs antes que o PostgreSQL de PRD seja afetado."
      - eval_time: 17m
        alertname: WorkshopHostFilesystemCritical

  - name: disco do host de PRD abaixo de 15% livre alerta critical após 5 minutos
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '25x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopHostFilesystemCritical
      - eval_time: 8m
        alertname: WorkshopHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 15% livre"
              description: "O ponto de montagem / tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."

  - name: disco do host de PRD que volta acima de 30% deixa de alertar
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '25x10 150x30'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 15% livre"
              description: "O ponto de montagem / tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."
      - eval_time: 25m
        alertname: WorkshopHostFilesystemCritical
      - eval_time: 25m
        alertname: WorkshopHostFilesystemLow

  - name: tmpfs no host de PRD não entra nos alertas de disco
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopHostFilesystemLow
      - eval_time: 30m
        alertname: WorkshopHostFilesystemCritical

  - name: métricas de containers de PRD ausentes alertam após 5 minutos
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopContainerMetricsAbsent
      - eval_time: 20m
        alertname: WorkshopContainerMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
            exp_annotations:
              summary: "Métricas de containers de PRD ausentes"
              description: "Nenhum container de PRD foi reportado nos últimos 10 minutos. Verifique o containers-collector e a allowlist da API do Docker na VM de PRD."

  - name: containers de PRD reportados não alertam ausência
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '100+60x40'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '100+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopContainerMetricsAbsent
      - eval_time: 30m
        alertname: WorkshopApiContainerAbsent
      - eval_time: 30m
        alertname: WorkshopDbContainerAbsent

  - name: container da API de PRD que deixa de ser reportado alerta após 7 minutos
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '1x5 _x20 1x30'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: WorkshopApiContainerAbsent
      - eval_time: 14m
        alertname: WorkshopApiContainerAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
              container_name: workshop-api
            exp_annotations:
              summary: "Container da API de PRD ausente"
              description: "O container workshop-api não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
      - eval_time: 40m
        alertname: WorkshopApiContainerAbsent

  - name: container do PostgreSQL de PRD que deixa de ser reportado alerta após 7 minutos
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '1x5 _x20 1x30'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: WorkshopDbContainerAbsent
      - eval_time: 14m
        alertname: WorkshopDbContainerAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
              container_name: workshop-db
            exp_annotations:
              summary: "Container do PostgreSQL de PRD ausente"
              description: "O container workshop-db não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
      - eval_time: 40m
        alertname: WorkshopDbContainerAbsent

  - name: container de PRD que reinicia três vezes em 30 minutos alerta warning
    interval: 1m
    input_series:
      - series: 'container_restarts_total{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '0+1x10 10x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: WorkshopContainerRestarting
      - eval_time: 5m
        alertname: WorkshopContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              container_name: workshop-api
            exp_annotations:
              summary: "Container de PRD reiniciando"
              description: "workshop-api reiniciou 3 vezes ou mais nos últimos 30 minutos."
      - eval_time: 40m
        alertname: WorkshopContainerRestarting

  - name: reinício único de container de PRD não alerta
    interval: 1m
    input_series:
      - series: 'container_restarts_total{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '0 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopContainerRestarting

  - name: disco abaixo de 30% livre alerta warning, abaixo de 15% critical
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/"}'
        values: '50x20 25x20'
      - series: 'node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: QaHostFilesystemLow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: node-exporter
              instance: node-exporter:9100
              mountpoint: /
            exp_annotations:
              summary: "Disco da VM de QA abaixo de 30% livre"
              description: "Reduza retenção ou ingestão da observabilidade antes de afetar a homologação."
      - eval_time: 18m
        alertname: QaHostFilesystemCritical
      - eval_time: 30m
        alertname: QaHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: node-exporter
              instance: node-exporter:9100
              mountpoint: /
            exp_annotations:
              summary: "Disco da VM de QA abaixo de 15% livre"
              description: "Pare ou descarte telemetria antes que o PostgreSQL de QA fique sem espaço."

  - name: amostra fora da janela fora de ordem alerta sem espera
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_out_of_order_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0 0 0 5 5 5'
      - series: 'prometheus_tsdb_too_old_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusOutOfOrderSamplesRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
            exp_annotations:
              summary: "Prometheus rejeitando amostras fora de ordem"
              description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."

  - name: Tunnel e node-exporter fora do ar entram no alerta de alvo
    interval: 1m
    input_series:
      - series: 'up{job="cloudflared",instance="cloudflared:2000"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ObservabilityTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: cloudflared
              instance: cloudflared:2000
            exp_annotations:
              summary: "Alvo de observabilidade indisponível"
              description: "cloudflared em cloudflared:2000 está indisponível há mais de 10 minutos."

  # 600 MB < 0,8 × 768 MiB (644 MB): sem alerta; 700 MB dispara.
  - name: pressão de memória abaixo de 80% de 768 MiB não alerta
    interval: 1m
    input_series:
      - series: 'otelcol_process_memory_rss{job="otel-collector-internal",instance="otel-collector:8888"}'
        values: '600000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OTelCollectorMemoryPressure

  - name: pressão de memória acima de 80% de 768 MiB alerta
    interval: 1m
    input_series:
      - series: 'otelcol_process_memory_rss{job="otel-collector-internal",instance="otel-collector:8888"}'
        values: '700000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OTelCollectorMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: otel-collector-internal
              instance: otel-collector:8888
            exp_annotations:
              summary: "Collector próximo do limite de memória"
              description: "O uso RSS do Collector excede 80% do limite do memory_limiter (768 MiB)."

  - name: scrape da API de QA falhando alerta warning, sem afetar os alertas de PRD
    interval: 1m
    input_series:
      - series: 'up{job="workshop/workshop-api-qa",instance="workshop-api-qa:8080",deployment_environment_name="qa"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: WorkshopApiQaScrapeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/workshop-api-qa
              instance: workshop-api-qa:8080
              deployment_environment_name: qa
            exp_annotations:
              summary: "Scrape da API de QA falhando"
              description: "O Prometheus não consegue raspar /actuator/prometheus da API de QA há mais de 10 minutos."
      - eval_time: 15m
        alertname: WorkshopApiScrapeFailing
      # A série de QA não satisfaz a ausência das métricas de PRD.
      - eval_time: 20m
        alertname: WorkshopApiMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api
            exp_annotations:
              summary: "Métricas da API ausentes"
              description: "Nenhuma amostra de up da API chegou ao Prometheus nos últimos 10 minutos."

  - name: blackbox fora do ar entra no alerta de alvo
    interval: 1m
    input_series:
      - series: 'up{job="blackbox",instance="blackbox:9115"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ObservabilityTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: blackbox
              instance: blackbox:9115
            exp_annotations:
              summary: "Alvo de observabilidade indisponível"
              description: "blackbox em blackbox:9115 está indisponível há mais de 10 minutos."

  # Sonda externa da API de produção (job workshop/workshop-api-prod-probe).
  - name: API de produção fora do ar na sonda alerta após 3 minutos
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: WorkshopApiProductionDown
      - eval_time: 10m
        alertname: WorkshopApiProductionDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
              instance: https://api.eletroluk.com/actuator/health
              deployment_environment_name: production
            exp_annotations:
              summary: "API de produção indisponível na sonda externa"
              description: "https://api.eletroluk.com/actuator/health não respondeu de forma saudável há mais de 3 minutos. A sonda sai da VM de QA pela internet pública e pela Cloudflare: falha de rede da QA também dispara este alerta."

  - name: falha de um minuto na sonda da API de produção não alerta
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5 0x1 1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkshopApiProductionDown

  - name: sonda saudável da API de produção não alerta indisponibilidade
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionDown

  - name: sem nenhum resultado da sonda de produção alerta ausência após 5 minutos
    interval: 1m
    input_series:
      - series: 'up{job="prometheus",instance="prometheus:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopApiProductionProbeAbsent
      - eval_time: 6m
        alertname: WorkshopApiProductionProbeAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
            exp_annotations:
              summary: "Sonda da API de produção sem resultados"
              description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."

  # Série que para de chegar (blackbox fora do ar no meio do período) também é ausência.
  - name: sonda que deixa de publicar resultados alerta ausência
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 14m
        alertname: WorkshopApiProductionProbeAbsent
      - eval_time: 17m
        alertname: WorkshopApiProductionProbeAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
            exp_annotations:
              summary: "Sonda da API de produção sem resultados"
              description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."

  - name: sonda com resultados recentes não alerta ausência
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionProbeAbsent

  - name: sonda bem-sucedida acima de 5 segundos alerta lentidão após 10 minutos
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '6x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopApiProductionSlow
      - eval_time: 12m
        alertname: WorkshopApiProductionSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/workshop-api-prod-probe
              instance: https://api.eletroluk.com/actuator/health
              deployment_environment_name: production
            exp_annotations:
              summary: "API de produção lenta na sonda externa"
              description: "A sonda de https://api.eletroluk.com/actuator/health levou mais de 5 segundos para concluir com sucesso há mais de 10 minutos."

  - name: sonda rápida com sucesso não alerta lentidão
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '0.4x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionSlow

  # Falha já é coberta por WorkshopApiProductionDown; lentidão não deve duplicar.
  - name: sonda lenta que falha não alerta lentidão
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '10x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionSlow

  # Resíduo preso do sizer bytes (0.161) com os dados fluindo: sem alerta.
  - name: fila com resíduo e envio ativo não alerta backlog
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '52770x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="traces",deployment_environment_name="production"}'
        values: '0x30'
      - series: 'otelcol_exporter_sent_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+1200x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OTelCollectorQueueBacklog

  - name: fila com dados e envio parado alerta backlog
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_grpc/tempo",data_type="traces"}'
        values: '0x30'
      - series: 'otelcol_exporter_queue_size{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_http/prometheus",data_type="metrics"}'
        values: '1000+1000x30'
      - series: 'otelcol_exporter_sent_metric_points{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_http/prometheus"}'
        values: '5000x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OTelCollectorQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: otel-collector-internal
              exporter: otlp_http/prometheus
            exp_annotations:
              summary: "Fila do Collector acumulando"
              description: "A fila do exporter otlp_http/prometheus (otel-collector-internal) tem dados e nada foi enviado há mais de 15 minutos (destino indisponível)."

  - name: fila cheia da borda de PRD alerta descarte e ocupação
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+100x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '60000000x30'
      - series: 'otelcol_exporter_queue_capacity{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '67108864x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OTelCollectorEnqueueFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Fila do Collector descartando dados"
              description: "O exporter otlp_grpc/qa não consegue enfileirar dados (fila cheia)."
      - eval_time: 20m
        alertname: OTelCollectorQueueNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/otelcol-contrib
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Fila do Collector acima de 80%"
              description: "A fila do exporter otlp_grpc/qa está acima de 80% da capacidade."

  - name: amostra mais velha que a janela fora de ordem alerta sem espera
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_out_of_order_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0x5'
      - series: 'prometheus_tsdb_too_old_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0 0 0 5 5 5'
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusOutOfOrderSamplesRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
            exp_annotations:
              summary: "Prometheus rejeitando amostras fora de ordem"
              description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."

# Execução: promtool test rules --enable-feature=promql-delayed-name-removal tests/control_plane_test.yml
# (a partir de platform/observability/control-plane/prometheus). As regras
# herdadas do laboratório local são cobertas por local/prometheus/tests.
rule_files:
  - ../rules/observability.yml

evaluation_interval: 1m

tests:
  # Host e containers de PRD (jobs workshop/node-exporter e workshop/docker-stats).
  - name: métricas do host de PRD ausentes alertam após 5 minutos e voltam ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x3 _x37 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkshopHostMetricsAbsent
      - eval_time: 19m
        alertname: WorkshopHostMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/node-exporter
            exp_annotations:
              summary: "Métricas do host de PRD ausentes"
              description: "Nenhuma amostra do node-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."
      - eval_time: 44m
        alertname: WorkshopHostMetricsAbsent

  - name: host de PRD com métricas presentes não alerta ausência
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopHostMetricsAbsent

  - name: node-exporter de PRD fora do ar alerta após 5 minutos e volta ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopHostScrapeFailing
      - eval_time: 10m
        alertname: WorkshopHostScrapeFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/node-exporter
            exp_annotations:
              summary: "Scrape do node-exporter de PRD falhando"
              description: "O Collector de borda não consegue raspar o node-exporter do host há mais de 5 minutos."
      - eval_time: 25m
        alertname: WorkshopHostScrapeFailing

  - name: disco do host de PRD abaixo de 30% livre alerta warning após 15 minutos
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '50x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: WorkshopHostFilesystemLow
      - eval_time: 17m
        alertname: WorkshopHostFilesystemLow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 30% livre"
              description: "O ponto de montagem / tem menos de 30% livre há mais de 15 minutos. Reveja retenção de backups e logs antes que o PostgreSQL de PRD seja afetado."
      - eval_time: 17m
        alertname: WorkshopHostFilesystemCritical

  - name: disco do host de PRD abaixo de 15% livre alerta critical após 5 minutos
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '25x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopHostFilesystemCritical
      - eval_time: 8m
        alertname: WorkshopHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 15% livre"
              description: "O ponto de montagem / tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."

  - name: disco do host de PRD que volta acima de 30% deixa de alertar
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '25x10 150x30'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="/dev/sda1",fstype="ext4",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              mountpoint: /
            exp_annotations:
              summary: "Disco do host de PRD abaixo de 15% livre"
              description: "O ponto de montagem / tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."
      - eval_time: 25m
        alertname: WorkshopHostFilesystemCritical
      - eval_time: 25m
        alertname: WorkshopHostFilesystemLow

  - name: tmpfs no host de PRD não entra nos alertas de disco
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="workshop/node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '10x40'
      - series: 'node_filesystem_size_bytes{job="workshop/node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/run"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopHostFilesystemLow
      - eval_time: 30m
        alertname: WorkshopHostFilesystemCritical

  - name: métricas de containers de PRD ausentes alertam após 5 minutos
    interval: 1m
    input_series:
      - series: 'up{job="workshop/node-exporter"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopContainerMetricsAbsent
      - eval_time: 20m
        alertname: WorkshopContainerMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
            exp_annotations:
              summary: "Métricas de containers de PRD ausentes"
              description: "Nenhum container de PRD foi reportado nos últimos 10 minutos. Verifique o containers-collector e a allowlist da API do Docker na VM de PRD."

  - name: containers de PRD reportados não alertam ausência
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '100+60x40'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '100+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkshopContainerMetricsAbsent
      - eval_time: 30m
        alertname: WorkshopApiContainerAbsent
      - eval_time: 30m
        alertname: WorkshopDbContainerAbsent

  - name: container da API de PRD que deixa de ser reportado alerta após 7 minutos
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '1x5 _x20 1x30'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: WorkshopApiContainerAbsent
      - eval_time: 14m
        alertname: WorkshopApiContainerAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
              container_name: workshop-api
            exp_annotations:
              summary: "Container da API de PRD ausente"
              description: "O container workshop-api não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
      - eval_time: 40m
        alertname: WorkshopApiContainerAbsent

  - name: container do PostgreSQL de PRD que deixa de ser reportado alerta após 7 minutos
    interval: 1m
    input_series:
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-db",deployment_environment_name="production"}'
        values: '1x5 _x20 1x30'
      - series: 'container_uptime_seconds{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 11m
        alertname: WorkshopDbContainerAbsent
      - eval_time: 14m
        alertname: WorkshopDbContainerAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/docker-stats
              container_name: workshop-db
            exp_annotations:
              summary: "Container do PostgreSQL de PRD ausente"
              description: "O container workshop-db não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
      - eval_time: 40m
        alertname: WorkshopDbContainerAbsent

  - name: container de PRD que reinicia três vezes em 30 minutos alerta warning
    interval: 1m
    input_series:
      - series: 'container_restarts_total{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '0+1x10 10x40'
    alert_rule_test:
      - eval_time: 1m
        alertname: WorkshopContainerRestarting
      - eval_time: 5m
        alertname: WorkshopContainerRestarting
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              container_name: workshop-api
            exp_annotations:
              summary: "Container de PRD reiniciando"
              description: "workshop-api reiniciou 3 vezes ou mais nos últimos 30 minutos."
      - eval_time: 40m
        alertname: WorkshopContainerRestarting

  - name: reinício único de container de PRD não alerta
    interval: 1m
    input_series:
      - series: 'container_restarts_total{job="workshop/docker-stats",container_name="workshop-api",deployment_environment_name="production"}'
        values: '0 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopContainerRestarting

  - name: disco abaixo de 30% livre alerta warning, abaixo de 15% critical
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/"}'
        values: '50x20 25x20'
      - series: 'node_filesystem_size_bytes{job="node-exporter",instance="node-exporter:9100",mountpoint="/"}'
        values: '200x40'
    alert_rule_test:
      - eval_time: 18m
        alertname: QaHostFilesystemLow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: node-exporter
              instance: node-exporter:9100
              mountpoint: /
            exp_annotations:
              summary: "Disco da VM de QA abaixo de 30% livre"
              description: "Reduza retenção ou ingestão da observabilidade antes de afetar a homologação."
      - eval_time: 18m
        alertname: QaHostFilesystemCritical
      - eval_time: 30m
        alertname: QaHostFilesystemCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: node-exporter
              instance: node-exporter:9100
              mountpoint: /
            exp_annotations:
              summary: "Disco da VM de QA abaixo de 15% livre"
              description: "Pare ou descarte telemetria antes que o PostgreSQL de QA fique sem espaço."

  - name: amostra fora da janela fora de ordem alerta sem espera
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_out_of_order_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0 0 0 5 5 5'
      - series: 'prometheus_tsdb_too_old_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusOutOfOrderSamplesRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
            exp_annotations:
              summary: "Prometheus rejeitando amostras fora de ordem"
              description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."

  - name: Tunnel e node-exporter fora do ar entram no alerta de alvo
    interval: 1m
    input_series:
      - series: 'up{job="cloudflared",instance="cloudflared:2000"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ObservabilityTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: cloudflared
              instance: cloudflared:2000
            exp_annotations:
              summary: "Alvo de observabilidade indisponível"
              description: "cloudflared em cloudflared:2000 está indisponível há mais de 10 minutos."

  # 600 MB < 0,8 × 768 MiB (644 MB): sem alerta; 700 MB dispara.
  - name: pressão de memória abaixo de 80% de 768 MiB não alerta
    interval: 1m
    input_series:
      - series: 'otelcol_process_memory_rss{job="otel-collector-internal",instance="otel-collector:8888"}'
        values: '600000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OTelCollectorMemoryPressure

  - name: pressão de memória acima de 80% de 768 MiB alerta
    interval: 1m
    input_series:
      - series: 'otelcol_process_memory_rss{job="otel-collector-internal",instance="otel-collector:8888"}'
        values: '700000000x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: OTelCollectorMemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: otel-collector-internal
              instance: otel-collector:8888
            exp_annotations:
              summary: "Collector próximo do limite de memória"
              description: "O uso RSS do Collector excede 80% do limite do memory_limiter (768 MiB)."

  - name: scrape da API de QA falhando alerta warning, sem afetar os alertas de PRD
    interval: 1m
    input_series:
      - series: 'up{job="workshop/workshop-api-qa",instance="workshop-api-qa:8080",deployment_environment_name="qa"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: WorkshopApiQaScrapeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/workshop-api-qa
              instance: workshop-api-qa:8080
              deployment_environment_name: qa
            exp_annotations:
              summary: "Scrape da API de QA falhando"
              description: "O Prometheus não consegue raspar /actuator/prometheus da API de QA há mais de 10 minutos."
      - eval_time: 15m
        alertname: WorkshopApiScrapeFailing
      # A série de QA não satisfaz a ausência das métricas de PRD.
      - eval_time: 20m
        alertname: WorkshopApiMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api
            exp_annotations:
              summary: "Métricas da API ausentes"
              description: "Nenhuma amostra de up da API chegou ao Prometheus nos últimos 10 minutos."

  - name: blackbox fora do ar entra no alerta de alvo
    interval: 1m
    input_series:
      - series: 'up{job="blackbox",instance="blackbox:9115"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: ObservabilityTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: blackbox
              instance: blackbox:9115
            exp_annotations:
              summary: "Alvo de observabilidade indisponível"
              description: "blackbox em blackbox:9115 está indisponível há mais de 10 minutos."

  # Sonda externa da API de produção (job workshop/workshop-api-prod-probe).
  - name: API de produção fora do ar na sonda alerta após 3 minutos
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 8m
        alertname: WorkshopApiProductionDown
      - eval_time: 10m
        alertname: WorkshopApiProductionDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
              instance: https://api.eletroluk.com/actuator/health
              deployment_environment_name: production
            exp_annotations:
              summary: "API de produção indisponível na sonda externa"
              description: "https://api.eletroluk.com/actuator/health não respondeu de forma saudável há mais de 3 minutos. A sonda sai da VM de QA pela internet pública e pela Cloudflare: falha de rede da QA também dispara este alerta."

  - name: falha de um minuto na sonda da API de produção não alerta
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5 0x1 1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkshopApiProductionDown

  - name: sonda saudável da API de produção não alerta indisponibilidade
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionDown

  - name: sem nenhum resultado da sonda de produção alerta ausência após 5 minutos
    interval: 1m
    input_series:
      - series: 'up{job="prometheus",instance="prometheus:9090"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 4m
        alertname: WorkshopApiProductionProbeAbsent
      - eval_time: 6m
        alertname: WorkshopApiProductionProbeAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
            exp_annotations:
              summary: "Sonda da API de produção sem resultados"
              description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."

  # Série que para de chegar (blackbox fora do ar no meio do período) também é ausência.
  - name: sonda que deixa de publicar resultados alerta ausência
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x5'
    alert_rule_test:
      - eval_time: 14m
        alertname: WorkshopApiProductionProbeAbsent
      - eval_time: 17m
        alertname: WorkshopApiProductionProbeAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/workshop-api-prod-probe
            exp_annotations:
              summary: "Sonda da API de produção sem resultados"
              description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."

  - name: sonda com resultados recentes não alerta ausência
    interval: 1m
    input_series:
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionProbeAbsent

  - name: sonda bem-sucedida acima de 5 segundos alerta lentidão após 10 minutos
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '6x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopApiProductionSlow
      - eval_time: 12m
        alertname: WorkshopApiProductionSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/workshop-api-prod-probe
              instance: https://api.eletroluk.com/actuator/health
              deployment_environment_name: production
            exp_annotations:
              summary: "API de produção lenta na sonda externa"
              description: "A sonda de https://api.eletroluk.com/actuator/health levou mais de 5 segundos para concluir com sucesso há mais de 10 minutos."

  - name: sonda rápida com sucesso não alerta lentidão
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '0.4x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionSlow

  # Falha já é coberta por WorkshopApiProductionDown; lentidão não deve duplicar.
  - name: sonda lenta que falha não alerta lentidão
    interval: 1m
    input_series:
      - series: 'probe_duration_seconds{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '10x30'
      - series: 'probe_success{job="workshop/workshop-api-prod-probe",instance="https://api.eletroluk.com/actuator/health",deployment_environment_name="production"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: WorkshopApiProductionSlow

  # Resíduo preso do sizer bytes (0.161) com os dados fluindo: sem alerta.
  - name: fila com resíduo e envio ativo não alerta backlog
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '52770x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="traces",deployment_environment_name="production"}'
        values: '0x30'
      - series: 'otelcol_exporter_sent_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+1200x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OTelCollectorQueueBacklog

  - name: fila com dados e envio parado alerta backlog
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_grpc/tempo",data_type="traces"}'
        values: '0x30'
      - series: 'otelcol_exporter_queue_size{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_http/prometheus",data_type="metrics"}'
        values: '1000+1000x30'
      - series: 'otelcol_exporter_sent_metric_points{job="otel-collector-internal",instance="otel-collector:8888",exporter="otlp_http/prometheus"}'
        values: '5000x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: OTelCollectorQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: otel-collector-internal
              exporter: otlp_http/prometheus
            exp_annotations:
              summary: "Fila do Collector acumulando"
              description: "A fila do exporter otlp_http/prometheus (otel-collector-internal) tem dados e nada foi enviado há mais de 15 minutos (destino indisponível)."

  - name: fila cheia da borda de PRD alerta descarte e ocupação
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+100x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '60000000x30'
      - series: 'otelcol_exporter_queue_capacity{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",data_type="metrics",deployment_environment_name="production"}'
        values: '67108864x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OTelCollectorEnqueueFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Fila do Collector descartando dados"
              description: "O exporter otlp_grpc/qa não consegue enfileirar dados (fila cheia)."
      - eval_time: 20m
        alertname: OTelCollectorQueueNearlyFull
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/otelcol-contrib
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Fila do Collector acima de 80%"
              description: "A fila do exporter otlp_grpc/qa está acima de 80% da capacidade."

  # Duas séries de nomes diferentes no mesmo exporter: sem a flag, rate() deixava
  # rótulos iguais e a regra falhava com "same labelset".
  - name: falhas simultâneas de spans e pontos de métrica no mesmo exporter alertam sem erro
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+10x30'
      - series: 'otelcol_exporter_send_failed_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OTelCollectorExportFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Falha de exportação no Collector"
              description: "O exporter otlp_grpc/qa falha continuamente há mais de 10 minutos."

  # Primeira falha: a série nasce com valor 1 e rate() não tem dois pontos. Dispara
  # quando a série nova sustenta o for (10 min) e resolve quando a janela de 15 min passa.
  - name: primeira falha de exportação com série nova alerta após o for
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_spans_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '_x5 1x30'
    alert_rule_test:
      - eval_time: 14m
        alertname: OTelCollectorExportFailures
      - eval_time: 16m
        alertname: OTelCollectorExportFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Falha de exportação no Collector"
              description: "O exporter otlp_grpc/qa falha continuamente há mais de 10 minutos."
      - eval_time: 25m
        alertname: OTelCollectorExportFailures

  # Série nova de um sinal no exporter que já tinha falha antiga de outro sinal: o
  # unless compara o nome (rótulo metric) e não deixa a série antiga mascarar a nova.
  - name: primeira falha de spans com falha antiga de pontos de métrica no mesmo exporter alerta após o for
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_metric_points_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '1x40'
      - series: 'otelcol_exporter_send_failed_spans_total{job="workshop/otelcol-contrib",exporter="otlp_grpc/qa",deployment_environment_name="production"}'
        values: '_x20 1x20'
    alert_rule_test:
      - eval_time: 29m
        alertname: OTelCollectorExportFailures
      - eval_time: 31m
        alertname: OTelCollectorExportFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_grpc/qa
            exp_annotations:
              summary: "Falha de exportação no Collector"
              description: "O exporter otlp_grpc/qa falha continuamente há mais de 10 minutos."

  - name: amostra mais velha que a janela fora de ordem alerta sem espera
    interval: 1m
    input_series:
      - series: 'prometheus_tsdb_out_of_order_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0x5'
      - series: 'prometheus_tsdb_too_old_samples_total{job="prometheus",instance="prometheus:9090",type="float"}'
        values: '0 0 0 5 5 5'
    alert_rule_test:
      - eval_time: 4m
        alertname: PrometheusOutOfOrderSamplesRejected
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
            exp_annotations:
              summary: "Prometheus rejeitando amostras fora de ordem"
              description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."

  - name: linha recusada pelo Loki alerta sem espera
    interval: 1m
    input_series:
      - series: 'loki_discarded_samples_total{job="loki",instance="loki:3100",reason="too_far_behind",tenant="fake"}'
        values: '0 0 0 2 2 2'
    alert_rule_test:
      - eval_time: 2m
        alertname: LokiDiscardedSamples
      - eval_time: 4m
        alertname: LokiDiscardedSamples
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              reason: too_far_behind
            exp_annotations:
              summary: "Loki descartando linhas de log"
              description: "O Loki recusou linhas de log nos últimos 10 minutos (motivo too_far_behind)."

  # PostgreSQL de PRD (job workshop/postgres-exporter).
  - name: métricas do PostgreSQL de PRD ausentes alertam após 5 minutos e voltam ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/postgres-exporter"}'
        values: '1x3 _x37 1x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: WorkshopPostgresMetricsAbsent
      - eval_time: 19m
        alertname: WorkshopPostgresMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/postgres-exporter
            exp_annotations:
              summary: "Métricas do PostgreSQL de PRD ausentes"
              description: "Nenhuma amostra do postgres-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."
      - eval_time: 44m
        alertname: WorkshopPostgresMetricsAbsent

  - name: PostgreSQL de PRD sem resposta ao exporter alerta após 3 minutos e volta ao normal
    interval: 1m
    input_series:
      - series: 'up{job="workshop/postgres-exporter"}'
        values: '1x40'
      - series: 'pg_up{job="workshop/postgres-exporter"}'
        values: '1x5 0x10 1x25'
    alert_rule_test:
      - eval_time: 7m
        alertname: WorkshopPostgresDown
      - eval_time: 12m
        alertname: WorkshopPostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/postgres-exporter
            exp_annotations:
              summary: "PostgreSQL de PRD inacessível ao monitoramento"
              description: "O postgres-exporter não consegue consultar o PostgreSQL de PRD há mais de 3 minutos. Verifique o container workshop-db, a rede workshop-db-metrics e o papel workshop_metrics."
      - eval_time: 30m
        alertname: WorkshopPostgresDown

  - name: postgres-exporter de PRD fora do ar também alerta PostgreSQL inacessível
    interval: 1m
    input_series:
      - series: 'up{job="workshop/postgres-exporter"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: WorkshopPostgresDown
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/postgres-exporter
            exp_annotations:
              summary: "PostgreSQL de PRD inacessível ao monitoramento"
              description: "O postgres-exporter não consegue consultar o PostgreSQL de PRD há mais de 3 minutos. Verifique o container workshop-db, a rede workshop-db-metrics e o papel workshop_metrics."

  - name: conexões do PostgreSQL de PRD acima de 80% alertam após 10 minutos
    interval: 1m
    input_series:
      - series: 'pg_stat_database_numbackends{job="workshop/postgres-exporter",datname="workshop"}'
        values: '70x10 85x20'
      - series: 'pg_stat_database_numbackends{job="workshop/postgres-exporter",datname="postgres"}'
        values: '1x30'
      - series: 'pg_settings_max_connections{job="workshop/postgres-exporter"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: WorkshopPostgresConnectionsHigh
      - eval_time: 22m
        alertname: WorkshopPostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
            exp_annotations:
              summary: "PostgreSQL de PRD acima de 80% das conexões"
              description: "As conexões abertas passam de 80% de max_connections há mais de 10 minutos."

  - name: deadlock no PostgreSQL de PRD alerta por banco
    interval: 1m
    input_series:
      - series: 'pg_stat_database_deadlocks_total{job="workshop/postgres-exporter",datname="workshop"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopPostgresDeadlocks
      - eval_time: 15m
        alertname: WorkshopPostgresDeadlocks
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              datname: workshop
            exp_annotations:
              summary: "Deadlock no PostgreSQL de PRD"
              description: "O banco workshop registrou deadlock nos últimos 15 minutos."
      - eval_time: 35m
        alertname: WorkshopPostgresDeadlocks

  - name: falha no arquivamento de WAL de PRD alerta critical
    interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count_total{job="workshop/postgres-exporter"}'
        values: '0x10 2x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: WorkshopPostgresWalArchiveFailing
      - eval_time: 15m
        alertname: WorkshopPostgresWalArchiveFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/postgres-exporter
            exp_annotations:
              summary: "Arquivamento de WAL do PostgreSQL de PRD falhando"
              description: "O archive_command (pgBackRest) falhou nos últimos 15 minutos. Verifique o repositório de backup antes que o PITR perca cobertura."
      - eval_time: 35m
        alertname: WorkshopPostgresWalArchiveFailing

  - name: watchdog fica sempre disparado
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
              owner: platform
            exp_annotations:
              summary: "Sinal de vida da cadeia de alertas"
              description: "Sempre disparado; a ausência de pings no Healthchecks.io indica que Prometheus ou Alertmanager pararam de notificar."

  # Alloy (job workshop/alloy): ausência por ambiente, sem um satisfazer o outro.
  - name: alloy de PRD ausente alerta critical e a QA presente não alerta
    interval: 1m
    input_series:
      - series: 'up{job="workshop/alloy",deployment_environment_name="production"}'
        values: '1x3'
      - series: 'up{job="workshop/alloy",deployment_environment_name="qa"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 12m
        alertname: AlloyProductionMetricsAbsent
      - eval_time: 19m
        alertname: AlloyProductionMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              job: workshop/alloy
              deployment_environment_name: production
            exp_annotations:
              summary: "Métricas do Alloy de PRD ausentes"
              description: "Nenhuma amostra do Alloy de PRD chegou nos últimos 10 minutos: o Alloy ou o Collector de borda estão parados, ou a borda não alcança a QA."
      - eval_time: 19m
        alertname: AlloyQaMetricsAbsent

  - name: alloy de QA ausente alerta warning
    interval: 1m
    input_series:
      - series: 'up{job="workshop/alloy",deployment_environment_name="production"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: AlloyQaMetricsAbsent
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              job: workshop/alloy
              deployment_environment_name: qa
            exp_annotations:
              summary: "Métricas do Alloy de QA ausentes"
              description: "Nenhuma amostra do Alloy de QA chegou nos últimos 10 minutos: o Alloy ou o otel-collector-qa-api estão parados."
      - eval_time: 6m
        alertname: AlloyProductionMetricsAbsent

  - name: componente do alloy não saudável alerta após 10 minutos
    interval: 1m
    input_series:
      - series: 'alloy_component_controller_running_components{job="workshop/alloy",deployment_environment_name="production",controller_path="/",health_type="healthy"}'
        values: '7x30'
      - series: 'alloy_component_controller_running_components{job="workshop/alloy",deployment_environment_name="production",controller_path="/",health_type="unhealthy"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlloyComponentUnhealthy
      - eval_time: 15m
        alertname: AlloyComponentUnhealthy
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              deployment_environment_name: production
              health_type: unhealthy
            exp_annotations:
              summary: "Componente do Alloy não saudável"
              description: "O Alloy de production tem componente em estado unhealthy há mais de 10 minutos."

  # Refresh a cada 15 s: 4 falhas por minuto com o proxy fora.
  - name: alloy sem acesso ao docker alerta e contador parado não alerta
    interval: 1m
    input_series:
      - series: 'prometheus_sd_refresh_failures_total{job="workshop/alloy",deployment_environment_name="qa",component_id="discovery.docker.containers",mechanism="docker"}'
        values: '0+4x30'
      - series: 'prometheus_sd_refresh_failures_total{job="workshop/alloy",deployment_environment_name="production",component_id="discovery.docker.containers",mechanism="docker"}'
        values: '3x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AlloyDockerDiscoveryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              deployment_environment_name: qa
            exp_annotations:
              summary: "Alloy sem acesso ao Docker"
              description: "O Alloy de qa não consegue listar os containers pelo docker-logs-proxy há mais de 10 minutos."

  - name: fila de logs do alloy parada alerta e com envio ativo não alerta
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="workshop/alloy",deployment_environment_name="production",exporter="otlp_http/otelcol.exporter.otlphttp.collector",data_type="logs"}'
        values: '5+5x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/alloy",deployment_environment_name="production",exporter="otlp_http/otelcol.exporter.otlphttp.collector",data_type="metrics"}'
        values: '0x30'
      - series: 'otelcol_exporter_sent_log_records_total{job="workshop/alloy",deployment_environment_name="production",exporter="otlp_http/otelcol.exporter.otlphttp.collector"}'
        values: '9000x30'
      - series: 'otelcol_exporter_queue_size{job="workshop/alloy",deployment_environment_name="qa",exporter="otlp_http/otelcol.exporter.otlphttp.collector",data_type="logs"}'
        values: '2x30'
      - series: 'otelcol_exporter_sent_log_records_total{job="workshop/alloy",deployment_environment_name="qa",exporter="otlp_http/otelcol.exporter.otlphttp.collector"}'
        values: '0+50x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: AlloyLogsQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              owner: platform
              deployment_environment_name: production
            exp_annotations:
              summary: "Fila de logs do Alloy acumulando"
              description: "A fila de logs do Alloy de production tem dados e nada foi enviado há mais de 15 minutos (Collector recusando ou fora)."

  # Erro permanente de envio do Alloy: mesmo alerta genérico do Collector.
  - name: falha permanente de envio do alloy alerta pelo alerta genérico
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records_total{job="workshop/alloy",deployment_environment_name="production",exporter="otlp_http/otelcol.exporter.otlphttp.collector"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: OTelCollectorExportFailures
        exp_alerts:
          - exp_labels:
              severity: critical
              owner: platform
              exporter: otlp_http/otelcol.exporter.otlphttp.collector
            exp_annotations:
              summary: "Falha de exportação no Collector"
              description: "O exporter otlp_http/otelcol.exporter.otlphttp.collector falha continuamente há mais de 10 minutos."

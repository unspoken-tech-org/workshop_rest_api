# Nomes conferidos no Collector contrib 0.161.0. O Collector interno é raspado
# (sem sufixo _total); a telemetria da borda de PRD chega por OTLP
# (job workshop/otelcol-contrib) e os counters ganham _total. Revalidar após
# cada upgrade do Collector com `promtool test rules
# --enable-feature=promql-delayed-name-removal` (tests/).
groups:
  - name: control-plane-health
    interval: 30s
    rules:
      - record: observability:target_up_ratio
        expr: avg by (job) (up{job=~"otel-collector-internal|loki|tempo|grafana|alertmanager|cloudflared|node-exporter|blackbox"})

      - alert: ObservabilityTargetDown
        expr: up{job=~"otel-collector-internal|loki|tempo|grafana|alertmanager|cloudflared|node-exporter|blackbox"} == 0
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Alvo de observabilidade indisponível"
          description: "{{ $labels.job }} em {{ $labels.instance }} está indisponível há mais de 10 minutos."

      # Os três sinais: spans, pontos de métrica e registros de log. A segunda parte
      # pega a primeira falha: a série nasce com valor 1 e rate() ainda não tem dois
      # pontos. O offset é o for mais 5 min, para a série nova sustentar o alerta até
      # o for. A flag promql-delayed-name-removal (compose) evita a colisão de rótulos
      # do rate() entre os nomes. O unless ignora __name__: o label_replace copia o
      # nome para o rótulo metric, para a série de um sinal não mascarar a de outro.
      - alert: OTelCollectorExportFailures
        expr: |
          sum by (exporter) (
            rate({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (exporter) (
            label_replace({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"} offset 15m, "metric", "$1", "__name__", "(.+)")
          )
        for: 10m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Falha de exportação no Collector"
          description: "O exporter {{ $labels.exporter }} falha continuamente há mais de 10 minutos."

      # Mesma cláusula de série nova da falha de exportação, com offset = for + 5 min.
      - alert: OTelCollectorEnqueueFailures
        expr: |
          sum by (exporter) (
            rate({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (exporter) (
            label_replace({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"} offset 10m, "metric", "$1", "__name__", "(.+)")
          )
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Fila do Collector descartando dados"
          description: "O exporter {{ $labels.exporter }} não consegue enfileirar dados (fila cheia)."

      # Com retry sem prazo (fila persistente), send_failed só cresce com erro
      # permanente: backend fora do ar aparece como fila parada, sem envio.
      # Exigir envio zerado evita o falso positivo do 0.161: após descartes,
      # queue_size (sizer bytes) fica preso num resíduo com os dados fluindo.
      # max por exporter: na borda um exporter atende os três sinais.
      - alert: OTelCollectorQueueBacklog
        expr: |
          max by (job, exporter) (
            min_over_time(otelcol_exporter_queue_size{job=~"otel-collector-internal|workshop/otelcol-contrib"}[10m])
          ) > 0
          unless on (job, exporter)
          sum by (job, exporter) (
            rate({__name__=~"otelcol_exporter_sent_(spans|metric_points|log_records)(_total)?"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Fila do Collector acumulando"
          description: "A fila do exporter {{ $labels.exporter }} ({{ $labels.job }}) tem dados e nada foi enviado há mais de 15 minutos (destino indisponível)."

      - alert: OTelCollectorQueueNearlyFull
        expr: |
          max by (job, exporter) (
            otelcol_exporter_queue_size{job=~"otel-collector-internal|workshop/otelcol-contrib"}
              / otelcol_exporter_queue_capacity{job=~"otel-collector-internal|workshop/otelcol-contrib"}
          ) > 0.80
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Fila do Collector acima de 80%"
          description: "A fila do exporter {{ $labels.exporter }} está acima de 80% da capacidade."

      # memory_limiter recusa dados quando o limite é atingido.
      - alert: OTelCollectorReceiverRefused
        expr: |
          sum by (receiver) (
            rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (receiver) (
            label_replace({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"} offset 10m, "metric", "$1", "__name__", "(.+)")
          )
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Collector recusando dados"
          description: "O receiver {{ $labels.receiver }} está recusando dados (pressão de memória ou backpressure)."

      # 768 MiB = processors.memory_limiter.limit_mib do Collector interno.
      # Manter em sincronia com collector/config.yaml.
      - alert: OTelCollectorMemoryPressure
        expr: otelcol_process_memory_rss > 0.80 * 768 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Collector próximo do limite de memória"
          description: "O uso RSS do Collector excede 80% do limite do memory_limiter (768 MiB)."

  - name: workshop-api-scrape
    interval: 30s
    rules:
      - alert: WorkshopApiScrapeFailing
        expr: up{job="workshop/workshop-api"} == 0
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Scrape da API falhando"
          description: "O Collector não consegue raspar /actuator/prometheus da API há mais de 5 minutos."

      # Ausência de dados não é estado saudável.
      - alert: WorkshopApiMetricsAbsent
        expr: absent_over_time(up{job="workshop/workshop-api"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Métricas da API ausentes"
          description: "Nenhuma amostra de up da API chegou ao Prometheus nos últimos 10 minutos."

      # Homologação: warning, a QA pode ser reiniciada a qualquer momento.
      - alert: WorkshopApiQaScrapeFailing
        expr: up{job="workshop/workshop-api-qa"} == 0
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Scrape da API de QA falhando"
          description: "O Prometheus não consegue raspar /actuator/prometheus da API de QA há mais de 10 minutos."

  # Sonda externa da API de produção (blackbox na VM de QA). A medição passa
  # pela internet pública e pela Cloudflare: falha de rede da QA também dispara
  # estes alertas, o que é intencional para a detecção independente de PRD.
  - name: workshop-api-probe
    interval: 30s
    rules:
      - alert: WorkshopApiProductionDown
        expr: probe_success{job="workshop/workshop-api-prod-probe"} == 0
        for: 3m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "API de produção indisponível na sonda externa"
          description: "{{ $labels.instance }} não respondeu de forma saudável há mais de 3 minutos. A sonda sai da VM de QA pela internet pública e pela Cloudflare: falha de rede da QA também dispara este alerta."

      # Sem resultado de sonda a detecção está cega: blackbox fora do ar ou
      # inacessível (o scrape falho não gera probe_success) ou job removido.
      - alert: WorkshopApiProductionProbeAbsent
        expr: absent(probe_success{job="workshop/workshop-api-prod-probe"})
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Sonda da API de produção sem resultados"
          description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."

      # Só alerta lentidão em sonda bem-sucedida; falha já é coberta por
      # WorkshopApiProductionDown.
      - alert: WorkshopApiProductionSlow
        expr: |
          probe_duration_seconds{job="workshop/workshop-api-prod-probe"} > 5
            and on (job, instance)
          probe_success{job="workshop/workshop-api-prod-probe"} == 1
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "API de produção lenta na sonda externa"
          description: "A sonda de {{ $labels.instance }} levou mais de 5 segundos para concluir com sucesso há mais de 10 minutos."

  - name: prometheus-integrity
    interval: 1m
    rules:
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Falha ao avaliar regra do Prometheus"
          description: "O Prometheus registrou falha de avaliação de regras nos últimos 5 minutos."

  # Disco único da VM de QA (Fase 0): a telemetria deve ser reduzida antes de
  # afetar o PostgreSQL de QA ou o host.
  - name: control-plane-capacity
    interval: 1m
    rules:
      - alert: QaHostFilesystemLow
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.30
        for: 15m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Disco da VM de QA abaixo de 30% livre"
          description: "Reduza retenção ou ingestão da observabilidade antes de afetar a homologação."

      - alert: QaHostFilesystemCritical
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Disco da VM de QA abaixo de 15% livre"
          description: "Pare ou descarte telemetria antes que o PostgreSQL de QA fique sem espaço."

      # Amostras do replay fora da janela out_of_order_time_window são
      # rejeitadas (perda de métricas após queda longa PRD → QA). Com a janela
      # habilitada, essas contam em too_old_samples, não em out_of_order_samples.
      # Os dois contadores têm os mesmos rótulos; somados em separado, porque
      # increase() remove o __name__ e um vetor único teria rótulos duplicados.
      - alert: PrometheusOutOfOrderSamplesRejected
        expr: |
          (sum(increase(prometheus_tsdb_out_of_order_samples_total[10m])) or vector(0))
          + (sum(increase(prometheus_tsdb_too_old_samples_total[10m])) or vector(0))
          > 0
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Prometheus rejeitando amostras fora de ordem"
          description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."

  # Host e containers de PRD, chegados pela borda (jobs workshop/node-exporter e
  # workshop/docker-stats). As regras de ausência só valem com a borda atualizada:
  # antes do deploy dos novos coletores, a ausência é o estado real.
  - name: prd-host
    interval: 1m
    rules:
      - alert: WorkshopHostMetricsAbsent
        expr: absent_over_time(up{job="workshop/node-exporter"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Métricas do host de PRD ausentes"
          description: "Nenhuma amostra do node-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."

      - alert: WorkshopHostScrapeFailing
        expr: up{job="workshop/node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Scrape do node-exporter de PRD falhando"
          description: "O Collector de borda não consegue raspar o node-exporter do host há mais de 5 minutos."

      # Por ponto de montagem, sem tmpfs, overlay e squashfs (não são disco do host).
      - alert: WorkshopHostFilesystemLow
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.30
        for: 15m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Disco do host de PRD abaixo de 30% livre"
          description: "O ponto de montagem {{ $labels.mountpoint }} tem menos de 30% livre há mais de 15 minutos. Reveja retenção de backups e logs antes que o PostgreSQL de PRD seja afetado."

      - alert: WorkshopHostFilesystemCritical
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.15
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Disco do host de PRD abaixo de 15% livre"
          description: "O ponto de montagem {{ $labels.mountpoint }} tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."

  - name: prd-containers
    interval: 1m
    rules:
      # Nenhum container de PRD reportado: a allowlist, o Collector de containers
      # ou a API do Docker não estão respondendo.
      - alert: WorkshopContainerMetricsAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Métricas de containers de PRD ausentes"
          description: "Nenhum container de PRD foi reportado nos últimos 10 minutos. Verifique o containers-collector e a allowlist da API do Docker na VM de PRD."

      # Container que deixa de ser reportado: parado ou removido. A janela de 5
      # minutos mais 2 de espera evita alerta em recriações curtas do deploy.
      - alert: WorkshopApiContainerAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats", container_name="workshop-api"}[5m])
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Container da API de PRD ausente"
          description: "O container workshop-api não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."

      - alert: WorkshopDbContainerAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats", container_name="workshop-db"}[5m])
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Container do PostgreSQL de PRD ausente"
          description: "O container workshop-db não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."

      # O Docker reinicia containers com restart policy; três reinícios em 30 minutos
      # indicam loop de falha. O contador zera na recriação do container.
      - alert: WorkshopContainerRestarting
        expr: sum by (container_name) (increase(container_restarts_total{job="workshop/docker-stats"}[30m])) >= 3
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Container de PRD reiniciando"
          description: "{{ $labels.container_name }} reiniciou 3 vezes ou mais nos últimos 30 minutos."

  # PostgreSQL de PRD, pelo postgres-exporter da borda (job workshop/postgres-exporter).
  # pg_up 0 com o exporter no ar: o banco não responde ao papel de monitoramento
  # (banco fora, rede workshop-db-metrics desconectada ou senha divergente).
  - name: prd-postgres
    interval: 1m
    rules:
      - alert: WorkshopPostgresMetricsAbsent
        expr: absent_over_time(up{job="workshop/postgres-exporter"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Métricas do PostgreSQL de PRD ausentes"
          description: "Nenhuma amostra do postgres-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."

      - alert: WorkshopPostgresDown
        expr: pg_up{job="workshop/postgres-exporter"} == 0 or up{job="workshop/postgres-exporter"} == 0
        for: 3m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "PostgreSQL de PRD inacessível ao monitoramento"
          description: "O postgres-exporter não consegue consultar o PostgreSQL de PRD há mais de 3 minutos. Verifique o container workshop-db, a rede workshop-db-metrics e o papel workshop_metrics."

      - alert: WorkshopPostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends{job="workshop/postgres-exporter"})
            / max(pg_settings_max_connections{job="workshop/postgres-exporter"}) > 0.80
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "PostgreSQL de PRD acima de 80% das conexões"
          description: "As conexões abertas passam de 80% de max_connections há mais de 10 minutos."

      - alert: WorkshopPostgresDeadlocks
        expr: sum by (datname) (increase(pg_stat_database_deadlocks_total{job="workshop/postgres-exporter"}[15m])) > 0
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Deadlock no PostgreSQL de PRD"
          description: "O banco {{ $labels.datname }} registrou deadlock nos últimos 15 minutos."

      # Falha do archive_command (pgBackRest): o WAL não chega ao repositório e a
      # recuperação a um ponto no tempo deixa de cobrir as escritas recentes.
      - alert: WorkshopPostgresWalArchiveFailing
        expr: increase(pg_stat_archiver_failed_count_total{job="workshop/postgres-exporter"}[15m]) > 0
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Arquivamento de WAL do PostgreSQL de PRD falhando"
          description: "O archive_command (pgBackRest) falhou nos últimos 15 minutos. Verifique o repositório de backup antes que o PITR perca cobertura."

  # Alloy da QA e da borda de PRD (job workshop/alloy), por OTLP pelo Collector de
  # cada ambiente, que carimba deployment_environment_name. Erro permanente de envio
  # cai no OTelCollectorExportFailures (mesmos nomes de métrica, sem filtro de job).
  # Container sem logs é coberto pelas regras do Loki (loki/rules/logs.yaml): o
  # Alloy não expõe a contagem de alvos.
  - name: alloy
    interval: 1m
    rules:
      # Alloy parado, Collector do ambiente fora ou envio ao Prometheus interrompido.
      - alert: AlloyProductionMetricsAbsent
        expr: absent_over_time(up{job="workshop/alloy", deployment_environment_name="production"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: "Métricas do Alloy de PRD ausentes"
          description: "Nenhuma amostra do Alloy de PRD chegou nos últimos 10 minutos: o Alloy ou o Collector de borda estão parados, ou a borda não alcança a QA."

      # Homologação: warning, a QA pode ser reiniciada a qualquer momento.
      - alert: AlloyQaMetricsAbsent
        expr: absent_over_time(up{job="workshop/alloy", deployment_environment_name="qa"}[10m])
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Métricas do Alloy de QA ausentes"
          description: "Nenhuma amostra do Alloy de QA chegou nos últimos 10 minutos: o Alloy ou o otel-collector-qa-api estão parados."

      - alert: AlloyComponentUnhealthy
        expr: sum by (deployment_environment_name, health_type) (alloy_component_controller_running_components{job="workshop/alloy", health_type!="healthy"}) > 0
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Componente do Alloy não saudável"
          description: "O Alloy de {{ $labels.deployment_environment_name }} tem componente em estado {{ $labels.health_type }} há mais de 10 minutos."

      # O discovery.docker consulta o docker-logs-proxy a cada 15 s; falha contínua
      # é o proxy fora ou a allowlist recusando a listagem. Os logs param de chegar.
      - alert: AlloyDockerDiscoveryFailing
        expr: sum by (deployment_environment_name) (increase(prometheus_sd_refresh_failures_total{job="workshop/alloy", mechanism="docker"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Alloy sem acesso ao Docker"
          description: "O Alloy de {{ $labels.deployment_environment_name }} não consegue listar os containers pelo docker-logs-proxy há mais de 10 minutos."

      # Mesma lógica do OTelCollectorQueueBacklog: com retry sem prazo, destino fora
      # aparece como fila parada. As métricas têm fila própria e continuam chegando;
      # os logs ficam na fila em disco (alloy_data) até o Collector voltar a aceitar.
      - alert: AlloyLogsQueueBacklog
        expr: |
          max by (deployment_environment_name) (
            min_over_time(otelcol_exporter_queue_size{job="workshop/alloy", data_type="logs"}[10m])
          ) > 0
          unless on (deployment_environment_name)
          sum by (deployment_environment_name) (
            rate(otelcol_exporter_sent_log_records_total{job="workshop/alloy"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "Fila de logs do Alloy acumulando"
          description: "A fila de logs do Alloy de {{ $labels.deployment_environment_name }} tem dados e nada foi enviado há mais de 15 minutos (Collector recusando ou fora)."

  # Sinal de vida da cadeia de alertas (dead man's switch): sempre disparado. O
  # Alertmanager o envia só ao Healthchecks.io, que avisa por fora da VM de QA
  # quando os pings param (VM, Prometheus, Alertmanager ou rede fora).
  - name: watchdog
    interval: 1m
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          owner: platform
        annotations:
          summary: "Sinal de vida da cadeia de alertas"
          description: "Sempre disparado; a ausência de pings no Healthchecks.io indica que Prometheus ou Alertmanager pararam de notificar."

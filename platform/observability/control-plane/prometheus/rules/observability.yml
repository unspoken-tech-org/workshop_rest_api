# Nomes conferidos no Collector contrib 0.161.0. O Collector interno é raspado
# (sem sufixo _total); a telemetria da borda de PRD chega por OTLP
# (job workshop/otelcol-contrib) e os counters ganham _total. Revalidar após
# cada upgrade do Collector com `promtool test rules
# --enable-feature=promql-delayed-name-removal` (tests/).
groups:
  - name: control-plane-health
    interval: 30s
    rules:
      - record: observability:target_up_ratio
        expr: avg by (job) (up{job=~"otel-collector-internal|loki|tempo|grafana|alertmanager|cloudflared|node-exporter|blackbox"})

      - alert: ObservabilityTargetDown
        expr: up{job=~"otel-collector-internal|loki|tempo|grafana|alertmanager|cloudflared|node-exporter|blackbox"} == 0
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: monitoring
          environment: monitoring
        annotations:
          summary: "Alvo de observabilidade indisponível"
          description: "{{ $labels.job }} em {{ $labels.instance }} está indisponível há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/qa-monitoramento.md"

      # Os três sinais: spans, pontos de métrica e registros de log. A segunda parte
      # pega a primeira falha: a série nasce com valor 1 e rate() ainda não tem dois
      # pontos. O offset é o for mais 5 min, para a série nova sustentar o alerta até
      # o for. A flag promql-delayed-name-removal (compose) evita a colisão de rótulos
      # do rate() entre os nomes. O unless ignora __name__: o label_replace copia o
      # nome para o rótulo metric, para a série de um sinal não mascarar a de outro.
      - alert: OTelCollectorExportFailures
        expr: |
          sum by (exporter) (
            rate({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (exporter) (
            label_replace({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_exporter_send_failed_(spans|metric_points|log_records)(_total)?"} offset 15m, "metric", "$1", "__name__", "(.+)")
          )
        for: 10m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Falha de exportação no Collector"
          description: "O exporter {{ $labels.exporter }} falha continuamente há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # Mesma cláusula de série nova da falha de exportação, com offset = for + 5 min.
      - alert: OTelCollectorEnqueueFailures
        expr: |
          sum by (exporter) (
            rate({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (exporter) (
            label_replace({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_exporter_enqueue_failed_(spans|metric_points|log_records)(_total)?"} offset 10m, "metric", "$1", "__name__", "(.+)")
          )
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Fila do Collector descartando dados"
          description: "O exporter {{ $labels.exporter }} não consegue enfileirar dados (fila cheia)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # Com retry sem prazo (fila persistente), send_failed só cresce com erro
      # permanente: backend fora do ar aparece como fila parada, sem envio.
      # Exigir envio zerado evita o falso positivo do 0.161: após descartes,
      # queue_size (sizer bytes) fica preso num resíduo com os dados fluindo.
      # max por exporter: na borda um exporter atende os três sinais.
      - alert: OTelCollectorQueueBacklog
        expr: |
          max by (job, exporter) (
            min_over_time(otelcol_exporter_queue_size{job=~"otel-collector-internal|workshop/otelcol-contrib"}[10m])
          ) > 0
          unless on (job, exporter)
          sum by (job, exporter) (
            rate({__name__=~"otelcol_exporter_sent_(spans|metric_points|log_records)(_total)?"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Fila do Collector acumulando"
          description: "A fila do exporter {{ $labels.exporter }} ({{ $labels.job }}) tem dados e nada foi enviado há mais de 15 minutos (destino indisponível)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      - alert: OTelCollectorQueueNearlyFull
        expr: |
          max by (job, exporter) (
            otelcol_exporter_queue_size{job=~"otel-collector-internal|workshop/otelcol-contrib"}
              / otelcol_exporter_queue_capacity{job=~"otel-collector-internal|workshop/otelcol-contrib"}
          ) > 0.80
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Fila do Collector acima de 80%"
          description: "A fila do exporter {{ $labels.exporter }} está acima de 80% da capacidade."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # memory_limiter recusa dados quando o limite é atingido.
      - alert: OTelCollectorReceiverRefused
        expr: |
          sum by (receiver) (
            rate({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"}[5m])
          ) > 0
          or
          sum by (receiver) (
            label_replace({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"} > 0, "metric", "$1", "__name__", "(.+)")
              unless label_replace({__name__=~"otelcol_receiver_refused_(spans|metric_points|log_records)(_total)?"} offset 10m, "metric", "$1", "__name__", "(.+)")
          )
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Collector recusando dados"
          description: "O receiver {{ $labels.receiver }} está recusando dados (pressão de memória ou backpressure)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # 768 MiB = processors.memory_limiter.limit_mib do Collector interno.
      # Manter em sincronia com collector/config.yaml.
      - alert: OTelCollectorMemoryPressure
        expr: otelcol_process_memory_rss > 0.80 * 768 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: monitoring
        annotations:
          summary: "Collector próximo do limite de memória"
          description: "O uso RSS do Collector excede 80% do limite do memory_limiter (768 MiB)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

  - name: workshop-api-scrape
    interval: 30s
    rules:
      - alert: WorkshopApiScrapeFailing
        expr: up{job="workshop/workshop-api"} == 0
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "Scrape da API falhando"
          description: "O Collector não consegue raspar /actuator/prometheus da API há mais de 5 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

      # Ausência de dados não é estado saudável.
      - alert: WorkshopApiMetricsAbsent
        expr: absent_over_time(up{job="workshop/workshop-api"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "Métricas da API ausentes"
          description: "Nenhuma amostra de up da API chegou ao Prometheus nos últimos 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

      # Homologação: warning, a QA pode ser reiniciada a qualquer momento.
      - alert: WorkshopApiQaScrapeFailing
        expr: up{job="workshop/workshop-api-qa"} == 0
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: workshop-api
          environment: qa
        annotations:
          summary: "Scrape da API de QA falhando"
          description: "O Prometheus não consegue raspar /actuator/prometheus da API de QA há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

  # Sonda externa da API de produção (blackbox na VM de QA). A medição passa
  # pela internet pública e pela Cloudflare: falha de rede da QA também dispara
  # estes alertas, o que é intencional para a detecção independente de PRD.
  - name: workshop-api-probe
    interval: 30s
    rules:
      - alert: WorkshopApiProductionDown
        expr: probe_success{job="workshop/workshop-api-prod-probe"} == 0
        for: 3m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "API de produção indisponível na sonda externa"
          description: "{{ $labels.instance }} não respondeu de forma saudável há mais de 3 minutos. A sonda sai da VM de QA pela internet pública e pela Cloudflare: falha de rede da QA também dispara este alerta."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

      # Sem resultado de sonda a detecção está cega: blackbox fora do ar ou
      # inacessível (o scrape falho não gera probe_success) ou job removido.
      - alert: WorkshopApiProductionProbeAbsent
        expr: absent(probe_success{job="workshop/workshop-api-prod-probe"})
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "Sonda da API de produção sem resultados"
          description: "Nenhum resultado da sonda da API de produção chegou ao Prometheus há mais de 5 minutos. A indisponibilidade da API não está sendo detectada."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

      # Só alerta lentidão em sonda bem-sucedida; falha já é coberta por
      # WorkshopApiProductionDown.
      - alert: WorkshopApiProductionSlow
        expr: |
          probe_duration_seconds{job="workshop/workshop-api-prod-probe"} > 5
            and on (job, instance)
          probe_success{job="workshop/workshop-api-prod-probe"} == 1
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "API de produção lenta na sonda externa"
          description: "A sonda de {{ $labels.instance }} levou mais de 5 segundos para concluir com sucesso há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/alta-latencia.md"

  # SLOs da API de PRD (aprovados em 01/11/2026, janela de 28 dias): 99,5% das
  # requisições de negócio sem 5xx e 99% abaixo de 500 ms (bucket 0.5). Ficam
  # fora /actuator/* e a uri UNKNOWN (401 antes do roteamento). Sem tráfego a
  # razão é NaN e nada dispara: a API fora do ar fica com a sonda e o
  # WorkshopApiMetricsAbsent, porque a métrica do servidor não vê a falha. A
  # série de cada uri/status nasce no primeiro 5xx, que o rate() não conta.
  - name: workshop-api-slo
    interval: 1m
    rules:
      - record: workshop_api:slo_errors:ratio_rate5m
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[5m])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[5m]))
      - record: workshop_api:slo_slow:ratio_rate5m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[5m]))
      - record: workshop_api:slo_errors:ratio_rate30m
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[30m])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[30m]))
      - record: workshop_api:slo_slow:ratio_rate30m
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[30m]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[30m]))
      - record: workshop_api:slo_errors:ratio_rate1h
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[1h])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1h]))
      - record: workshop_api:slo_slow:ratio_rate1h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[1h]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1h]))
      - record: workshop_api:slo_errors:ratio_rate2h
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[2h])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[2h]))
      - record: workshop_api:slo_slow:ratio_rate2h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[2h]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[2h]))
      - record: workshop_api:slo_errors:ratio_rate6h
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[6h])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[6h]))
      - record: workshop_api:slo_slow:ratio_rate6h
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[6h]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[6h]))
      - record: workshop_api:slo_errors:ratio_rate1d
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[1d])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1d]))
      - record: workshop_api:slo_slow:ratio_rate1d
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[1d]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1d]))
      - record: workshop_api:slo_errors:ratio_rate3d
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",status=~"5.."}[3d])) or vector(0))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[3d]))
      - record: workshop_api:slo_slow:ratio_rate3d
        expr: |
          1 - sum(rate(http_server_requests_seconds_bucket{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN",le="0.5"}[3d]))
            /
          sum(rate(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[3d]))
      - record: workshop_api:slo_requests:increase1h
        expr: sum(increase(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1h]))
      - record: workshop_api:slo_requests:increase6h
        expr: sum(increase(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[6h]))
      - record: workshop_api:slo_requests:increase1d
        expr: sum(increase(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[1d]))
      - record: workshop_api:slo_requests:increase3d
        expr: sum(increase(http_server_requests_seconds_count{job="workshop/workshop-api",uri!~"/actuator/.*|UNKNOWN"}[3d]))

      # Burn rate multi-janela (SRE workbook): o rápido consome 2% do orçamento
      # em 1 h ou 5% em 6 h; o lento, 10% em 1 dia ou tudo em 3 dias. A janela
      # longa exige requisições suficientes (20, 40, 70 e 210) para que um 5xx
      # isolado não passe do limiar: a base é de ~210 requisições por dia.
      - alert: WorkshopApiErrorBudgetBurnFast
        expr: |
          (
            workshop_api:slo_errors:ratio_rate1h > (14.4 * 0.005)
              and workshop_api:slo_errors:ratio_rate5m > (14.4 * 0.005)
              and workshop_api:slo_requests:increase1h >= 20
          )
          or
          (
            workshop_api:slo_errors:ratio_rate6h > (6 * 0.005)
              and workshop_api:slo_errors:ratio_rate30m > (6 * 0.005)
              and workshop_api:slo_requests:increase6h >= 40
          )
        for: 2m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
          slo: availability
        annotations:
          summary: "API de produção consumindo rápido o orçamento de erros"
          description: "A taxa de 5xx da API consome o orçamento do SLO de 99,5% a 6 vezes ou mais o ritmo sustentável (janelas de 1 h ou 6 h)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"
      - alert: WorkshopApiErrorBudgetBurnSlow
        expr: |
          (
            workshop_api:slo_errors:ratio_rate1d > (3 * 0.005)
              and workshop_api:slo_errors:ratio_rate2h > (3 * 0.005)
              and workshop_api:slo_requests:increase1d >= 70
          )
          or
          (
            workshop_api:slo_errors:ratio_rate3d > (1 * 0.005)
              and workshop_api:slo_errors:ratio_rate6h > (1 * 0.005)
              and workshop_api:slo_requests:increase3d >= 210
          )
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: workshop-api
          environment: production
          slo: availability
        annotations:
          summary: "API de produção consumindo o orçamento de erros"
          description: "A taxa de 5xx da API consome o orçamento do SLO de 99,5% acima do ritmo sustentável (janelas de 1 ou 3 dias)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"
      - alert: WorkshopApiLatencyBudgetBurnFast
        expr: |
          (
            workshop_api:slo_slow:ratio_rate1h > (14.4 * 0.01)
              and workshop_api:slo_slow:ratio_rate5m > (14.4 * 0.01)
              and workshop_api:slo_requests:increase1h >= 20
          )
          or
          (
            workshop_api:slo_slow:ratio_rate6h > (6 * 0.01)
              and workshop_api:slo_slow:ratio_rate30m > (6 * 0.01)
              and workshop_api:slo_requests:increase6h >= 40
          )
        for: 2m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
          slo: latency
        annotations:
          summary: "API de produção lenta consumindo rápido o orçamento de latência"
          description: "As requisições acima de 500 ms consomem o orçamento do SLO de 99% a 6 vezes ou mais o ritmo sustentável (janelas de 1 h ou 6 h)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/alta-latencia.md"
      - alert: WorkshopApiLatencyBudgetBurnSlow
        expr: |
          (
            workshop_api:slo_slow:ratio_rate1d > (3 * 0.01)
              and workshop_api:slo_slow:ratio_rate2h > (3 * 0.01)
              and workshop_api:slo_requests:increase1d >= 70
          )
          or
          (
            workshop_api:slo_slow:ratio_rate3d > (1 * 0.01)
              and workshop_api:slo_slow:ratio_rate6h > (1 * 0.01)
              and workshop_api:slo_requests:increase3d >= 210
          )
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: workshop-api
          environment: production
          slo: latency
        annotations:
          summary: "API de produção lenta consumindo o orçamento de latência"
          description: "As requisições acima de 500 ms consomem o orçamento do SLO de 99% acima do ritmo sustentável (janelas de 1 ou 3 dias)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/alta-latencia.md"

  - name: prometheus-integrity
    interval: 1m
    rules:
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
          service: monitoring
          environment: monitoring
        annotations:
          summary: "Falha ao avaliar regra do Prometheus"
          description: "O Prometheus registrou falha de avaliação de regras nos últimos 5 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/qa-monitoramento.md"

  # Disco único da VM de QA (Fase 0): a telemetria deve ser reduzida antes de
  # afetar o PostgreSQL de QA ou o host.
  - name: control-plane-capacity
    interval: 1m
    rules:
      - alert: QaHostFilesystemLow
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.30
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: host
          environment: qa
        annotations:
          summary: "Disco da VM de QA abaixo de 30% livre"
          description: "Reduza retenção ou ingestão da observabilidade antes de afetar a homologação."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/disco-cheio.md"

      - alert: QaHostFilesystemCritical
        expr: |
          node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
            / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: host
          environment: qa
        annotations:
          summary: "Disco da VM de QA abaixo de 15% livre"
          description: "Pare ou descarte telemetria antes que o PostgreSQL de QA fique sem espaço."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/disco-cheio.md"

      # Amostras do replay fora da janela out_of_order_time_window são
      # rejeitadas (perda de métricas após queda longa PRD → QA). Com a janela
      # habilitada, essas contam em too_old_samples, não em out_of_order_samples.
      # Os dois contadores têm os mesmos rótulos; somados em separado, porque
      # increase() remove o __name__ e um vetor único teria rótulos duplicados.
      - alert: PrometheusOutOfOrderSamplesRejected
        expr: |
          (sum(increase(prometheus_tsdb_out_of_order_samples_total[10m])) or vector(0))
          + (sum(increase(prometheus_tsdb_too_old_samples_total[10m])) or vector(0))
          > 0
        labels:
          severity: warning
          owner: platform
          service: monitoring
          environment: monitoring
        annotations:
          summary: "Prometheus rejeitando amostras fora de ordem"
          description: "Amostras chegaram fora da janela de 6 horas e foram descartadas."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

      # Linhas recusadas pelo Loki (fora da janela de 6 horas no replay, limite
      # de taxa, linha grande demais): perda de logs, sem retry no Collector.
      # O contador só nasce no primeiro descarte, já com valor, e o increase()
      # não o vê: a segunda parte pega a série nova (offset = janela, sem for).
      - alert: LokiDiscardedSamples
        expr: |
          sum by (reason) (increase(loki_discarded_samples_total{job="loki"}[10m])) > 0
          or
          sum by (reason) (
            loki_discarded_samples_total{job="loki"} > 0
              unless loki_discarded_samples_total{job="loki"} offset 10m
          )
        labels:
          severity: warning
          owner: platform
          service: monitoring
          environment: monitoring
        annotations:
          summary: "Loki descartando linhas de log"
          description: "O Loki recusou linhas de log nos últimos 10 minutos (motivo {{ $labels.reason }})."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

  # Host e containers de PRD, chegados pela borda (jobs workshop/node-exporter e
  # workshop/docker-stats). As regras de ausência só valem com a borda atualizada:
  # antes do deploy dos novos coletores, a ausência é o estado real.
  - name: prd-host
    interval: 1m
    rules:
      # Toda a telemetria push de PRD passa pelo Collector de borda, cuja própria fila
      # (queue_capacity, gauge sempre presente) chega pela mesma fila. Sem ela, a VM de
      # PRD, a borda, o túnel até a QA ou o Collector interno estão fora. Dispara antes
      # das ausências derivadas (host, containers, banco, API, Alloy) e as inibe no
      # Alertmanager; a sonda pública (WorkshopApiProductionDown) segue sem inibição e
      # separa VM fora de borda fora.
      - alert: WorkshopEdgeTelemetryAbsent
        expr: absent_over_time(otelcol_exporter_queue_capacity{job="workshop/otelcol-contrib"}[5m])
        for: 1m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: production
        annotations:
          summary: "Telemetria da borda de PRD ausente"
          description: "Nenhuma métrica do Collector de borda de PRD chegou nos últimos 5 minutos: a VM de PRD, o Collector de borda ou o caminho até a QA estão fora. As ausências de host, containers, banco, API e Alloy de PRD ficam inibidas enquanto este alerta dispara."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

      - alert: WorkshopHostMetricsAbsent
        expr: absent_over_time(up{job="workshop/node-exporter"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: production
        annotations:
          summary: "Métricas do host de PRD ausentes"
          description: "Nenhuma amostra do node-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

      - alert: WorkshopHostScrapeFailing
        expr: up{job="workshop/node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: production
        annotations:
          summary: "Scrape do node-exporter de PRD falhando"
          description: "O Collector de borda não consegue raspar o node-exporter do host há mais de 5 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

      # Por ponto de montagem, sem tmpfs, overlay e squashfs (não são disco do host).
      - alert: WorkshopHostFilesystemLow
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.30
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: host
          environment: production
        annotations:
          summary: "Disco do host de PRD abaixo de 30% livre"
          description: "O ponto de montagem {{ $labels.mountpoint }} tem menos de 30% livre há mais de 15 minutos. Reveja retenção de backups e logs antes que o PostgreSQL de PRD seja afetado."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/disco-cheio.md"

      - alert: WorkshopHostFilesystemCritical
        expr: |
          min by (mountpoint) (
            node_filesystem_avail_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="workshop/node-exporter", fstype!~"tmpfs|overlay|squashfs"}
          ) < 0.15
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: host
          environment: production
        annotations:
          summary: "Disco do host de PRD abaixo de 15% livre"
          description: "O ponto de montagem {{ $labels.mountpoint }} tem menos de 15% livre há mais de 5 minutos. Libere espaço antes que o PostgreSQL de PRD fique sem espaço."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/disco-cheio.md"

  - name: prd-containers
    interval: 1m
    rules:
      # Nenhum container de PRD reportado: a allowlist, o Collector de containers
      # ou a API do Docker não estão respondendo.
      - alert: WorkshopContainerMetricsAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: production
        annotations:
          summary: "Métricas de containers de PRD ausentes"
          description: "Nenhum container de PRD foi reportado nos últimos 10 minutos. Verifique o containers-collector e a allowlist da API do Docker na VM de PRD."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/queda-ingestao.md"

      # Container que deixa de ser reportado: parado ou removido. A janela de 5
      # minutos mais 2 de espera evita alerta em recriações curtas do deploy.
      - alert: WorkshopApiContainerAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats", container_name="workshop-api"}[5m])
        for: 2m
        labels:
          severity: critical
          owner: platform
          service: workshop-api
          environment: production
        annotations:
          summary: "Container da API de PRD ausente"
          description: "O container workshop-api não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

      - alert: WorkshopDbContainerAbsent
        expr: absent_over_time(container_uptime_seconds{job="workshop/docker-stats", container_name="workshop-db"}[5m])
        for: 2m
        labels:
          severity: critical
          owner: platform
          service: postgres
          environment: production
        annotations:
          summary: "Container do PostgreSQL de PRD ausente"
          description: "O container workshop-db não é reportado há mais de 7 minutos: está parado, foi removido ou perdeu as métricas."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/postgresql.md"

      # O Docker reinicia containers com restart policy; três reinícios em 30 minutos
      # indicam loop de falha. O contador zera na recriação do container.
      - alert: WorkshopContainerRestarting
        expr: sum by (container_name) (increase(container_restarts_total{job="workshop/docker-stats"}[30m])) >= 3
        labels:
          severity: warning
          owner: platform
          service: "{{ if eq $labels.container_name \"workshop-db\" }}postgres{{ else }}workshop-api{{ end }}"
          environment: production
        annotations:
          summary: "Container de PRD reiniciando"
          description: "{{ $labels.container_name }} reiniciou 3 vezes ou mais nos últimos 30 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/api-indisponivel.md"

  # PostgreSQL de PRD, pelo postgres-exporter da borda (job workshop/postgres-exporter).
  # pg_up 0 com o exporter no ar: o banco não responde ao papel de monitoramento
  # (banco fora, rede workshop-db-metrics desconectada ou senha divergente).
  - name: prd-postgres
    interval: 1m
    rules:
      - alert: WorkshopPostgresMetricsAbsent
        expr: absent_over_time(up{job="workshop/postgres-exporter"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: postgres
          environment: production
        annotations:
          summary: "Métricas do PostgreSQL de PRD ausentes"
          description: "Nenhuma amostra do postgres-exporter de PRD chegou ao Prometheus nos últimos 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/postgresql.md"

      - alert: WorkshopPostgresDown
        expr: pg_up{job="workshop/postgres-exporter"} == 0 or up{job="workshop/postgres-exporter"} == 0
        for: 3m
        labels:
          severity: critical
          owner: platform
          service: postgres
          environment: production
        annotations:
          summary: "PostgreSQL de PRD inacessível ao monitoramento"
          description: "O postgres-exporter não consegue consultar o PostgreSQL de PRD há mais de 3 minutos. Verifique o container workshop-db, a rede workshop-db-metrics e o papel workshop_metrics."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/postgresql.md"

      - alert: WorkshopPostgresConnectionsHigh
        expr: |
          sum(pg_stat_database_numbackends{job="workshop/postgres-exporter"})
            / max(pg_settings_max_connections{job="workshop/postgres-exporter"}) > 0.80
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: postgres
          environment: production
        annotations:
          summary: "PostgreSQL de PRD acima de 80% das conexões"
          description: "As conexões abertas passam de 80% de max_connections há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/postgresql.md"

      - alert: WorkshopPostgresDeadlocks
        expr: sum by (datname) (increase(pg_stat_database_deadlocks_total{job="workshop/postgres-exporter"}[15m])) > 0
        labels:
          severity: warning
          owner: platform
          service: postgres
          environment: production
        annotations:
          summary: "Deadlock no PostgreSQL de PRD"
          description: "O banco {{ $labels.datname }} registrou deadlock nos últimos 15 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/postgresql.md"

      # Falha do archive_command (pgBackRest): o WAL não chega ao repositório e a
      # recuperação a um ponto no tempo deixa de cobrir as escritas recentes.
      - alert: WorkshopPostgresWalArchiveFailing
        expr: increase(pg_stat_archiver_failed_count_total{job="workshop/postgres-exporter"}[15m]) > 0
        labels:
          severity: critical
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Arquivamento de WAL do PostgreSQL de PRD falhando"
          description: "O archive_command (pgBackRest) falhou nos últimos 15 minutos. Verifique o repositório de backup antes que o PITR perca cobertura."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

      # Arquivamento parado sem falha registrada (archive_command travado): com
      # archive_timeout de 60 s, cada minuto com escrita fecha um segmento, que fica
      # em pg_wal até ser arquivado. De 17/10 a 01/11/2026 o pg_wal de PRD não passou
      # de 6 segmentos, nem nos backups full e nos deploys. Com o arquivamento em
      # dia, um pico de escrita é arquivado em segundos e a idade fica baixa. A idade
      # sozinha não serve: sem escrita não há WAL, e ela passa de 24 h no fim de semana.
      - alert: WorkshopPostgresWalArchiveStalled
        expr: |
          pg_wal_segments{job="workshop/postgres-exporter"} > 12
            and pg_stat_archiver_last_archive_age{job="workshop/postgres-exporter"} > 1800
        for: 15m
        labels:
          severity: critical
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Arquivamento de WAL do PostgreSQL de PRD parado"
          description: "Há {{ $value }} segmentos em pg_wal e nenhum WAL arquivado há mais de 30 minutos, sem falha registrada. Verifique o archive_command (pgBackRest) e o repositório antes que o PITR perca cobertura."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

  # Backups do pgBackRest de PRD, pelo textfile que o bin/pgbackrest-backup.sh grava a
  # partir do `pgbackrest info` em cada execução e o node-exporter da borda expõe.
  # Complementam o Healthchecks.io, que continua o alarme primário (fora de PRD e QA);
  # por isso warning. Agenda: full domingo 03:00 e diff seg–sáb 20:00; o maior
  # intervalo entre dois backups é de domingo 03:00 a segunda 20:00 (41 h).
  - name: prd-backup
    interval: 1m
    rules:
      # node-exporter de pé sem as séries do arquivo: falta o diretório, o arquivo ou o
      # deploy da API que o cria. Sem o node-exporter, avisa o WorkshopHostMetricsAbsent.
      - alert: WorkshopBackupMetricsAbsent
        expr: |
          absent_over_time(workshop_pgbackrest_last_backup_timestamp_seconds{job="workshop/node-exporter", type="full"}[1h])
            and on () (max(up{job="workshop/node-exporter"}) == 1)
        for: 30m
        labels:
          severity: warning
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Métricas de backup do pgBackRest de PRD ausentes"
          description: "O node-exporter de PRD responde, mas não expõe o último backup full há mais de 1 hora. Verifique /srv/pgbackrest/metrics/pgbackrest.prom e o bin/pgbackrest-backup.sh no host."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

      - alert: WorkshopBackupMetricsUnreadable
        expr: node_textfile_scrape_error{job="workshop/node-exporter"} == 1
        for: 30m
        labels:
          severity: warning
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Textfile de backup ilegível no node-exporter de PRD"
          description: "O node-exporter de PRD não consegue ler o diretório /srv/pgbackrest/metrics ou um arquivo dele há mais de 30 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

      # Semanal: 7 dias mais 6 horas de folga.
      - alert: WorkshopBackupFullStale
        expr: time() - workshop_pgbackrest_last_backup_timestamp_seconds{job="workshop/node-exporter", type="full"} > 7 * 86400 + 6 * 3600
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Backup full do pgBackRest de PRD atrasado"
          description: "O último backup full sem erro terminou há {{ $value | humanizeDuration }}. Confira o Healthchecks e o journal (tag workshop-backup) no host de PRD."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

      # Full ou diff: nenhum backup novo além do maior intervalo da agenda (41 h).
      - alert: WorkshopBackupStale
        expr: time() - max without (type) (workshop_pgbackrest_last_backup_timestamp_seconds{job="workshop/node-exporter"}) > 48 * 3600
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Nenhum backup do pgBackRest de PRD em 48 horas"
          description: "O backup mais recente sem erro (full ou diff) terminou há {{ $value | humanizeDuration }}. Confira o Healthchecks e o journal (tag workshop-backup) no host de PRD."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

      - alert: WorkshopBackupStanzaError
        expr: workshop_pgbackrest_stanza_status_code{job="workshop/node-exporter"} != 0
        for: 15m
        labels:
          severity: warning
          owner: platform
          service: backup
          environment: production
        annotations:
          summary: "Stanza do pgBackRest de PRD com erro"
          description: "O pgbackrest info da última execução registrou o código {{ $value }} na stanza workshop. Rode pgbackrest info e check no container workshop-db."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/falha-backup.md"

  # Alloy da QA e da borda de PRD (job workshop/alloy), por OTLP pelo Collector de
  # cada ambiente, que carimba deployment_environment_name. Erro permanente de envio
  # cai no OTelCollectorExportFailures (mesmos nomes de métrica, sem filtro de job).
  # Container sem logs é coberto pelas regras do Loki (loki/rules/logs.yaml): o
  # Alloy não expõe a contagem de alvos.
  - name: alloy
    interval: 1m
    rules:
      # Alloy parado, Collector do ambiente fora ou envio ao Prometheus interrompido.
      - alert: AlloyProductionMetricsAbsent
        expr: absent_over_time(up{job="workshop/alloy", deployment_environment_name="production"}[10m])
        for: 5m
        labels:
          severity: critical
          owner: platform
          service: telemetry
          environment: production
        annotations:
          summary: "Métricas do Alloy de PRD ausentes"
          description: "Nenhuma amostra do Alloy de PRD chegou nos últimos 10 minutos: o Alloy ou o Collector de borda estão parados, ou a borda não alcança a QA."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # Homologação: warning, a QA pode ser reiniciada a qualquer momento.
      - alert: AlloyQaMetricsAbsent
        expr: absent_over_time(up{job="workshop/alloy", deployment_environment_name="qa"}[10m])
        for: 5m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: qa
        annotations:
          summary: "Métricas do Alloy de QA ausentes"
          description: "Nenhuma amostra do Alloy de QA chegou nos últimos 10 minutos: o Alloy ou o otel-collector-qa-api estão parados."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      - alert: AlloyComponentUnhealthy
        expr: sum by (deployment_environment_name, health_type) (alloy_component_controller_running_components{job="workshop/alloy", health_type!="healthy"}) > 0
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: "{{ $labels.deployment_environment_name }}"
        annotations:
          summary: "Componente do Alloy não saudável"
          description: "O Alloy de {{ $labels.deployment_environment_name }} tem componente em estado {{ $labels.health_type }} há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # O discovery.docker consulta o docker-logs-proxy a cada 15 s; falha contínua
      # é o proxy fora ou a allowlist recusando a listagem. Os logs param de chegar.
      - alert: AlloyDockerDiscoveryFailing
        expr: sum by (deployment_environment_name) (increase(prometheus_sd_refresh_failures_total{job="workshop/alloy", mechanism="docker"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: "{{ $labels.deployment_environment_name }}"
        annotations:
          summary: "Alloy sem acesso ao Docker"
          description: "O Alloy de {{ $labels.deployment_environment_name }} não consegue listar os containers pelo docker-logs-proxy há mais de 10 minutos."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

      # Mesma lógica do OTelCollectorQueueBacklog: com retry sem prazo, destino fora
      # aparece como fila parada. As métricas têm fila própria e continuam chegando;
      # os logs ficam na fila em disco (alloy_data) até o Collector voltar a aceitar.
      - alert: AlloyLogsQueueBacklog
        expr: |
          max by (deployment_environment_name) (
            min_over_time(otelcol_exporter_queue_size{job="workshop/alloy", data_type="logs"}[10m])
          ) > 0
          unless on (deployment_environment_name)
          sum by (deployment_environment_name) (
            rate(otelcol_exporter_sent_log_records_total{job="workshop/alloy"}[10m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
          service: telemetry
          environment: "{{ $labels.deployment_environment_name }}"
        annotations:
          summary: "Fila de logs do Alloy acumulando"
          description: "A fila de logs do Alloy de {{ $labels.deployment_environment_name }} tem dados e nada foi enviado há mais de 15 minutos (Collector recusando ou fora)."
          runbook_url: "https://github.com/unspoken-tech-org/workshop_rest_api/blob/main/platform/observability/runbooks/collector-alloy.md"

  # Sinal de vida da cadeia de alertas (dead man's switch): sempre disparado. O
  # Alertmanager o envia só ao Healthchecks.io, que avisa por fora da VM de QA
  # quando os pings param (VM, Prometheus, Alertmanager ou rede fora).
  - name: watchdog
    interval: 1m
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          owner: platform
          service: monitoring
          environment: monitoring
        annotations:
          summary: "Sinal de vida da cadeia de alertas"
          description: "Sempre disparado; a ausência de pings no Healthchecks.io indica que Prometheus ou Alertmanager pararam de notificar."

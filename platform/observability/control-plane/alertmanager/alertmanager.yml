global:
  resolve_timeout: 5m

# Canal externo: Telegram (decisão de 06/10/2026), independente de produção.
# Token do bot e chat ID chegam como secrets em arquivo, fora deste diretório.
route:
  receiver: telegram
  group_by:
    - alertname
    - job
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - job
      - instance

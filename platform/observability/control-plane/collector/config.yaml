# Collector interno do plano de controle (VM de QA). Recebe por OTLP somente o
# Collector de borda da produção, pela rede privada (Tailscale): a porta é
# publicada apenas no IP Tailscale da VM e a ACL do tailnet restringe a origem
# à VM de produção. Não há receiver OTLP público.
#
# O ambiente é reescrito pela origem confiável (este receiver só atende PRD),
# nunca aceito do remetente. A redaction repete a da borda como defesa em
# profundidade. A fila de cada exporter fica em disco, como no laboratório
# local, para absorver reinícios dos backends.

extensions:
  # Lido pelo probe sidecar do Compose (a imagem é distroless).
  health_check:
    endpoint: 0.0.0.0:13133

  file_storage/queue:
    directory: /var/lib/otelcol/file_storage
    compaction:
      directory: /var/lib/otelcol/file_storage
      on_start: true
      on_rebound: true
      cleanup_on_start: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 768 MiB dentro do limite de 1 GiB do container.
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192

  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: x-api-key
        action: delete
      - key: api-key
        action: delete
      - key: password
        action: delete
      - key: passwd
        action: delete
      - key: secret
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: client_secret
        action: delete
      - pattern: ^http\.(request|response)\.header\..*
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: db.connection_string
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: url.path
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: enduser.id
        action: delete
      - key: enduser.email
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

  resource/redact:
    attributes:
      - key: host.ip
        action: delete
      - key: host.mac
        action: delete
      - key: process.command_line
        action: delete
      - key: process.command_args
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

  # Origem confiável: tudo que chega por este receiver é produção.
  resource/production:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
      - key: deployment.environment
        action: delete
      - key: service.namespace
        value: workshop
        action: upsert

  resource/metrics-labels:
    attributes:
      - key: service.instance.id
        action: delete

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    sending_queue: &persistent_queue
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: ${env:COLLECTOR_QUEUE_BYTES}
      batch:
        flush_timeout: 5s
        sizer: items
        min_size: 512
        max_size: 1024
    retry_on_failure: &retry_until_drained
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 10s
    sending_queue: *persistent_queue
    retry_on_failure: *retry_until_drained

  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    timeout: 10s
    sending_queue: *persistent_queue
    retry_on_failure: *retry_until_drained

service:
  extensions:
    - health_check
    - file_storage/queue
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - attributes/redact
      exporters:
        - otlp_grpc/tempo
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - resource/metrics-labels
        - attributes/redact
      exporters:
        - otlp_http/prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - resource/redact
        - resource/production
        - attributes/redact
      exporters:
        - otlp_http/loki

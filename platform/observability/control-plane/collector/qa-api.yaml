# Collector dedicado à homologação (VM de QA, projeto observability-control-plane-qa).
# Recebe por OTLP/HTTP somente a API de QA, pela rede qa-metrics (workshop-metrics), onde
# responde pelo nome do serviço otel-collector-qa-api. Só traces; métricas vêm do scrape
# do Prometheus e os logs saem pelo stdout coletado pelo Alloy.
#
# Não é o Collector interno do plano de controle: esse carimba tudo como production e
# recebe a produção pela Tailscale. Este carimba qa e não tem rota para a produção.
# Nenhuma porta é publicada; a origem é a rede qa-metrics, interna e sem saída.
#
# O ambiente é reescrito pela origem (resource/qa): o que a API declarar não vale.
# A redaction repete a da borda e a do Collector interno (defesa em profundidade). A
# fila fica em memória, sem file_storage: nesta fase não há volume novo, então um
# reinício do container descarta o que ainda estiver na fila.

extensions:
  # Lido pelo probe sidecar do Compose (a imagem é distroless).
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # Só HTTP: a API de QA exporta por http/protobuf (apps/api/otel/javaagent.properties).
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Container de 256 MiB: limite de 192 MiB e pico de 48 MiB, como na borda. A fila em
  # memória abaixo conta dentro desse teto.
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48

  # Descarta o ruído (R25a), em duas condições (o span cai se qualquer uma casar):
  # 1) o SERVER de /actuator/* (cada scrape de /actuator/prometheus e cada
  #    /actuator/health, a cada 15 s); 2) o CLIENT de banco sem operação nem statement,
  #    nas duas convenções: db.operation/db.statement (agent 2.32 por padrão) e
  #    db.operation.name/db.query.text (estável). É o span de obtenção de conexão feito
  #    sob a requisição; o agent emite o statement vazio, por isso a condição também
  #    casa "". Spans com operação (SELECT, INSERT...) passam. Roda antes da redaction,
  #    que remove url.path, db.statement e db.query.text. Os filhos INTERNAL/CLIENT que sobram de um SERVER descartado chegam
  #    sem pai: filtro sem estado não sabe quem foi descartado; descartá-los exigiria
  #    tail sampling, fora desta fase. Sem o atributo, IsMatch devolve falso.
  filter/noise:
    error_mode: ignore
    traces:
      span:
        - 'kind == SPAN_KIND_SERVER and (IsMatch(attributes["url.path"], "^/actuator(/|$)") or IsMatch(attributes["http.route"], "^/actuator(/|$)"))'
        - 'kind == SPAN_KIND_CLIENT and (attributes["db.system"] != nil or attributes["db.system.name"] != nil) and (attributes["db.operation"] == nil and attributes["db.operation.name"] == nil) and ((attributes["db.statement"] == nil or attributes["db.statement"] == "") and (attributes["db.query.text"] == nil or attributes["db.query.text"] == ""))'

  # Mesma lista do Collector interno (defesa em profundidade).
  resource/redact:
    attributes:
      - key: host.ip
        action: delete
      - key: host.mac
        action: delete
      - key: process.command_line
        action: delete
      - key: process.command_args
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

  # Origem confiável: tudo que chega por este receiver é homologação.
  resource/qa:
    attributes:
      - key: deployment.environment.name
        value: qa
        action: upsert
      # Atributo depreciado (R16).
      - key: deployment.environment
        action: delete
      - key: service.namespace
        value: workshop
        action: upsert

  # Mesma lista do Collector interno. client.address e user_agent.original ficam de
  # propósito (decisão de política de dados).
  attributes/redact:
    actions:
      - key: authorization
        action: delete
      - key: cookie
        action: delete
      - key: set-cookie
        action: delete
      - key: x-api-key
        action: delete
      - key: api-key
        action: delete
      - key: password
        action: delete
      - key: passwd
        action: delete
      - key: secret
        action: delete
      - key: access_token
        action: delete
      - key: refresh_token
        action: delete
      - key: client_secret
        action: delete
      - pattern: ^http\.(request|response)\.header\..*
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: db.connection_string
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
      - key: url.path
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: user.email
        action: delete
      - key: user.id
        action: delete
      - key: enduser.id
        action: delete
      - key: enduser.email
        action: delete
      - key: customer.cpf
        action: delete
      - key: user.cpf
        action: delete

exporters:
  # Único destino: o Tempo, pela rede cp-backend (interna, sem saída). Sem TLS: o
  # tráfego fica entre dois containers da mesma rede interna.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 10s
    # Fila em memória com limite de 16 MiB medido em bytes de protobuf. Os dados em
    # memória (pdata) ocupam mais que isso, então o teto fica baixo para caber nos
    # 192 MiB do memory_limiter. Cheia, a recusa chega ao receiver e a API perde o
    # envio; não há descarte silencioso depois do aceite.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 16777216
      # Lote montado na saída da fila, não por processor (R26a).
      batch:
        flush_timeout: 5s
        sizer: items
        min_size: 512
        max_size: 1024
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s

service:
  extensions:
    - health_check
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      # Interno ao container: sem porta publicada no host. Nenhum scrape a lê nesta fase.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/noise
        - resource/redact
        - resource/qa
        - attributes/redact
      exporters:
        - otlp_grpc/tempo

apiVersion: 1

# Dashboards versionados neste diretório; alterações pela interface não são
# persistidas (o arquivo é a fonte da verdade).
providers:
  - name: control-plane
    orgId: 1
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: workshop-observability

# Métricas OTLP do Collector (inclusive o scrape da API) chegam por
# /api/v1/otlp. A janela fora de ordem acomoda o replay da fila da borda.
storage:
  tsdb:
    out_of_order_time_window: 4h

otlp:
  # service.instance.id não é enviado em métricas (política de dados).
  promote_resource_attributes:
    - deployment.environment.name

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Telemetria interna do Collector (separada das métricas OTLP em :8889).
  - job_name: otel-collector-internal
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

# Stack local de observabilidade. Execute a partir da raiz do repositório:
# docker compose --project-directory . -p workshop-observability-local \
#   -f platform/observability/local/compose.yml up -d --wait
#
# Imagens fixadas por tag e digest (multi-arquitetura), conjunto pesquisado em
# 04/10/2026. Healthchecks verificam prontidão real; imagens distroless sem
# cliente HTTP (Collector e Loki) são verificadas por probes sidecar.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command:
      - --config=file:/etc/otelcol-contrib/config.yaml
    environment:
      # A API do perfil "api" é raspada pela identidade de leitura mínima,
      # simulando o Collector de borda (R17). Para a API no host (bootRun),
      # use API_SCRAPE_TARGET=host.docker.internal:8080 (pode ser bloqueado
      # pelo firewall do host, R21).
      API_SCRAPE_TARGET: ${API_SCRAPE_TARGET:-workshop-api:8080}
      API_SCRAPE_USERNAME: ${API_SCRAPE_USERNAME:-metrics-scraper}
      # Limite da fila persistente de cada exporter (256 MiB por padrão).
      COLLECTOR_QUEUE_BYTES: ${COLLECTOR_QUEUE_BYTES:-268435456}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - api_scrape_password
    ports:
      # Publicação local: o endpoint não fica acessível pela LAN.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./platform/observability/local/collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - otel_collector_queue:/var/lib/otelcol/file_storage
    networks:
      - observability-backend
      - observability-otlp
    depends_on:
      otel-collector-queue-init:
        condition: service_completed_successfully
      loki-probe:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    # Sem healthcheck próprio (distroless, sem cliente HTTP): a prontidão é
    # verificada pelo serviço otel-collector-probe via extensão health_check.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  # A imagem do Collector (distroless, usuário 10001) não tem diretório para
  # a fila: o volume nasce root e é entregue ao usuário antes da subida.
  otel-collector-queue-init:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["chown", "10001:10001", "/var/lib/otelcol/file_storage"]
    volumes:
      - otel_collector_queue:/var/lib/otelcol/file_storage
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  otel-collector-probe:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sleep", "2147483647"]
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - observability-backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # health_check do Collector responde 200 só com os pipelines em execução.
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://otel-collector:13133/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M

  loki-probe:
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["sleep", "2147483647"]
    depends_on:
      loki:
        condition: service_started
    networks:
      - observability-backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # A imagem do Loki 3.7 não traz wget/shell.
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://loki:3100/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 16M

  # O Alloy só enxerga a API Docker por este proxy: somente leitura (POST=0)
  # e apenas containers (listagem/inspeção/logs) e redes (R1). Nenhum outro serviço
  # monta o docker.sock.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      CONTAINERS: "1"
      # discovery.docker lê as redes para montar os labels dos alvos.
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability-docker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    user: "473:473"
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./platform/observability/local/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - observability-backend
      - observability-edge
      - observability-docker
    depends_on:
      otel-collector-probe:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # /-/ready só responde 200 depois que todos os componentes carregaram.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 96M

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command:
      - -config.file=/etc/loki/config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./platform/observability/local/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      - observability-backend
      - observability-edge
    restart: unless-stopped
    # Sem healthcheck próprio (imagem sem shell/wget): ver loki-probe.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 256M

  prometheus:
    # Linha LTS 3.13.x (suporte até 31/07/2027).
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./platform/observability/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform/observability/local/prometheus/rules:/etc/prometheus/rules:ro
      # Volume novo: Prometheus 3 não promete downgrade do TSDB para 2.x.
      - prometheus3_data:/prometheus
    networks:
      - observability-backend
      - observability-edge
    depends_on:
      alertmanager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 256M

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command:
      - -config.file=/etc/tempo/tempo.yaml
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./platform/observability/local/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      # Volume novo: Tempo 3 não tem downgrade suportado para 2.x.
      - tempo3_data:/var/tempo
    networks:
      - observability-backend
      - observability-edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 256M

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./platform/observability/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability-backend
      - observability-edge
    depends_on:
      loki-probe:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./platform/observability/local/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - observability-backend
      - observability-edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/bin/wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Perfil "api" (R21/R23): API em container com o perfil de log JSON de
  # QA/PRD, sobre base sintética descartável. Ative com --profile api.
  workshop-api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: apps/api/docker/Dockerfile
    image: workshop-api:observability-local
    environment:
      SPRING_PROFILES_ACTIVE: qa
      SPRING_DATASOURCE_URL: jdbc:postgresql://workshop-api-db:5432/workshop_synthetic
      SPRING_DATASOURCE_USERNAME: workshop_synthetic
      # Senha do banco e hash de scrape chegam como arquivos (configtree),
      # nunca por variável de ambiente.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      OBSERVABILITY_SCRAPE_USERNAME: ${API_SCRAPE_USERNAME:-metrics-scraper}
      # Java Agent (Fase 3/R5): jar baixado por scripts/fetch-javaagent.sh e
      # configuração versionada em apps/api/otel/javaagent.properties; aqui só
      # o que muda por ambiente. OTEL_RESOURCE_ATTRIBUTES substitui o valor do
      # arquivo, por isso repete service.namespace.
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx768m -Duser.timezone=America/Sao_Paulo
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.configuration-file=/otel/javaagent.properties
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=workshop,deployment.environment.name=local,service.version=local
      TZ: America/Sao_Paulo
    labels:
      com.workshop.observability.logs: "true"
      com.workshop.observability.service: workshop-api
    secrets:
      - source: synthetic_db_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: api_scrape_password_hash
        target: OBSERVABILITY_SCRAPE_PASSWORD_HASH
    volumes:
      # Chaves JWT de desenvolvimento do repositório, no caminho do perfil qa.
      - ./apps/api/src/main/resources/keys:/app/config/qa_keys:ro
      - ./platform/observability/local/.javaagent/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar:ro
      - ./apps/api/otel/javaagent.properties:/otel/javaagent.properties:ro
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-8080}:8080"
    networks:
      - observability-otlp
      - api-backend
    depends_on:
      workshop-api-db:
        condition: service_healthy
      otel-collector-probe:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  # Base sintética (R23): dados em tmpfs, descartados a cada "down"; nunca
  # restaurar cópia de produção aqui. Logs do banco não são coletados.
  workshop-api-db:
    profiles: ["api"]
    image: postgres:16.1-alpine@sha256:17eb369d9330fe7fbdb2f705418c18823d66322584c77c2b43cc0e1851d01de7
    environment:
      LC_ALL: C.UTF-8
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: workshop_synthetic
      POSTGRES_USER: workshop_synthetic
      POSTGRES_PASSWORD_FILE: /run/secrets/synthetic_db_password
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    secrets:
      - synthetic_db_password
    tmpfs:
      - /var/lib/postgresql/data:size=256m
    networks:
      - api-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workshop_synthetic", "-d", "workshop_synthetic"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # Semeia a API key sintética depois que o Flyway da API criou o schema.
  # Execução única e explícita ("compose run --rm"), fora do perfil "api",
  # para não quebrar o "up --wait".
  workshop-api-seed:
    profiles: ["seed"]
    image: postgres:16.1-alpine@sha256:17eb369d9330fe7fbdb2f705418c18823d66322584c77c2b43cc0e1851d01de7
    entrypoint: ["sh", "-c", "PGPASSWORD=\"$$(cat /run/secrets/synthetic_db_password)\" exec psql -h workshop-api-db -U workshop_synthetic -d workshop_synthetic -q -f /seed/seed.sql"]
    secrets:
      - synthetic_db_password
      - synthetic_api_key
    volumes:
      - ./platform/observability/local/synthetic/seed.sql:/seed/seed.sql:ro
    networks:
      - api-backend
    depends_on:
      workshop-api:
        condition: service_healthy
    restart: "no"

networks:
  # Rede interna: backends não são publicados diretamente na LAN.
  observability-backend:
    driver: bridge
    internal: true
  # Somente para publicar as interfaces locais; nenhum endpoint usa 0.0.0.0 no host.
  observability-edge:
    driver: bridge
  # Rede exclusiva dos endpoints OTLP publicados no loopback do host.
  observability-otlp:
    driver: bridge
  # Somente Alloy ↔ docker-socket-proxy.
  observability-docker:
    driver: bridge
    internal: true
  # Somente API ↔ banco sintético.
  api-backend:
    driver: bridge
    internal: true

# Arquivos locais fora do Git, gerados por scripts/init-secrets.sh; os
# caminhos podem ser trocados por variável.
secrets:
  # Senha da identidade de scrape da API (a API guarda apenas o hash bcrypt).
  api_scrape_password:
    file: ${API_SCRAPE_PASSWORD_FILE:-./platform/observability/local/.secrets/api-scrape-password}
  api_scrape_password_hash:
    file: ${API_SCRAPE_PASSWORD_HASH_FILE:-./platform/observability/local/.secrets/api-scrape-password-hash}
  synthetic_db_password:
    file: ./platform/observability/local/.secrets/synthetic-db-password
  synthetic_api_key:
    file: ./platform/observability/local/.secrets/synthetic-api-key

# prometheus_data e tempo_data (versões 2.x) são preservados fora do
# Compose para retorno; remova-os só por decisão explícita.
volumes:
  alloy_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  otel_collector_queue:
  prometheus3_data:
  tempo3_data:

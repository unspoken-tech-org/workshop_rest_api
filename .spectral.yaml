# Spectral ruleset for the OpenAPI document generated by SpringDoc.
# CI (job "OpenAPI Lint" in .github/workflows/ci.yml) exports the spec through
# OpenApiExportIT and runs:  spectral lint apps/api/build/openapi/openapi.json
# Local run:
#   ./gradlew :apps:api:integrationTests --tests '*OpenApiExportIT'
#   npx @stoplight/spectral-cli@6.15.0 lint apps/api/build/openapi/openapi.json
#
# Goal: lock the REST contract for NEW routes (e.g. /v1/service-orders).
# Legacy routes that predate these rules are listed under "overrides" below;
# that list may only shrink. Never add a new route to it.
extends: ["spectral:oas"]

rules:
  # Legacy: the DTO example for the status enum is not one of the enum values.
  oas3-valid-schema-example: off

  workshop-path-versioned:
    description: Every path starts with a version segment (/v1/...).
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/v[0-9]+/"

  workshop-path-kebab-lowercase:
    description: Path segments are lowercase kebab-case; parameters are camelCase in braces.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/([a-z][a-z0-9]*(-[a-z0-9]+)*|\\{[a-z][a-zA-Z0-9]*\\}))+$"

  workshop-path-no-verb:
    description: Paths name resources, not actions; the HTTP method is the verb.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        notMatch: "/(create|update|delete|remove|add|get|set|search|filter|find|list|reset[a-z-]*)(/|$)"

  workshop-path-plural-resource:
    description: The first resource segment after the version (and optional /admin) is a plural noun.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^/v[0-9]+/(admin/)?[a-z0-9-]*s(/|$)"

# Legacy routes that predate the rules above (A10 migrates them; Feature 24 routes
# /v1/customer-devices and /v1/service-orders are born compliant). Do not grow this list.
# Braces in the pointer are percent-encoded (%7B/%7D) because the file glob treats them as expansion.
overrides:
  - files: ["**/openapi.json#/paths/~1api~1auth~1refresh"]
    rules:
      workshop-path-plural-resource: off
      workshop-path-versioned: off
  - files: ["**/openapi.json#/paths/~1api~1auth~1revoke"]
    rules:
      workshop-path-plural-resource: off
      workshop-path-versioned: off
  - files: ["**/openapi.json#/paths/~1api~1auth~1token"]
    rules:
      workshop-path-plural-resource: off
      workshop-path-versioned: off
  - files: ["**/openapi.json#/paths/~1v1~1admin~1api-keys~1%7Bid%7D~1reset-device"]
    rules:
      workshop-path-no-verb: off
  - files: ["**/openapi.json#/paths/~1v1~1brand"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1brand~1search"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer-contact"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer-contact~1%7Bid%7D"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer~1search"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer~1%7Bid%7D"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1customer~1%7Bid%7D~1jpa"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1create"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1filter"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1search"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1update"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1update~1%7BdeviceId%7D~1revision"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1update~1%7BdeviceId%7D~1status"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1update~1%7BdeviceId%7D~1urgency"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1device~1%7BdeviceId%7D"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1model"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1model~1search"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1payment"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1technician"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1technician~1%7Bid%7D"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1type"]
    rules:
      workshop-path-plural-resource: off
  - files: ["**/openapi.json#/paths/~1v1~1type~1search"]
    rules:
      workshop-path-no-verb: off
      workshop-path-plural-resource: off

[global]
# repo1-path fica no default (/var/lib/pgbackrest): na PRD o repositório criptografado
# define o seu no arquivo incluído (repo1.conf), e a opção não pode aparecer duas vezes.
repo1-retention-full=4
repo1-retention-diff=14
process-max=4
start-fast=y
log-level-console=info
log-level-file=info
log-path=/var/log/pgbackrest

[workshop]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=DB_USER_PLACEHOLDER

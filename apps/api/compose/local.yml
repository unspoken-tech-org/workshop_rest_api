services:
  workshop-db:
    container_name: workshop-db
    image: postgres:16.16-alpine3.24@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      LC_ALL: C.UTF-8
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: workshop_db
      POSTGRES_USER: workshop_admin
      POSTGRES_PASSWORD: pass
    ports:
      - "5445:5432"
    command:
      - "postgres"
      - "-c"
      - "timezone=America/Sao_Paulo"
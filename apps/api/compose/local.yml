services:
  workshop-db:
    container_name: workshop-db
    image: postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      LC_ALL: C.UTF-8
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: workshop_db
      POSTGRES_USER: workshop_admin
      POSTGRES_PASSWORD: pass
    ports:
      - "5445:5432"
    command:
      - "postgres"
      - "-c"
      - "timezone=America/Sao_Paulo"
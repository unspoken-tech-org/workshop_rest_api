services:
  workshop_db:
    container_name: workshop-db
    build:
      context: .
      dockerfile: apps/api/docker/Dockerfile.pgbackrest
    image: workshop/postgres16-pgbackrest:latest
    restart: always
    environment:
      LC_ALL: C.UTF-8
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      # Segredos chegam como arquivos, nunca por variável de ambiente: o inspect
      # do container (Config.Env) é lido pelo coletor de containers da borda.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # Repositório S3 do pgBackRest (repo1-*) em arquivo incluído pelo pgbackrest.conf.
      PGBACKREST_CONFIG_INCLUDE_PATH: /run/secrets/pgbackrest
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "timezone=America/Sao_Paulo"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_timeout=60s"
      - "-c"
      - "archive_command=pgbackrest --stanza=workshop archive-push %p"
    secrets:
      - source: db_password
        target: db_password
      - source: pgbackrest_repo
        target: /run/secrets/pgbackrest/repo1.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' > /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - db_data:/var/lib/postgresql/data
      - /srv/pgbackrest/conf:/etc/pgbackrest:ro
      - /srv/pgbackrest/repo:/var/lib/pgbackrest
      - /srv/pgbackrest/logs:/var/log/pgbackrest
      - /srv/postgres/logical_dumps:/backups/logical
    # O deploy da borda (projeto workshop-edge) também conecta este container à rede
    # interna workshop-db-metrics, em tempo de execução, para o postgres-exporter. Ela
    # não é declarada aqui: mudar as redes do banco o recriaria no próximo deploy da
    # API. Recriado o banco, a conexão volta no próximo deploy da borda.
    networks:
      - workshop-network
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  workshop_spring_app:
    container_name: workshop-api
    labels:
      workshop.env: "production"
    restart: unless-stopped
    image: workshop_rest_api-workshop_spring_app:latest
    command: [ "java", "-Dspring.profiles.active=production", "-jar", "app.jar" ]
    expose:
      - "8080"
    stop_grace_period: 60s
    depends_on:
      workshop_db:
        condition: service_healthy
    environment:
      # Host pelo container_name (com hífen): nome com underscore não é válido em URI
      # e o agent registra server.address errado nos spans JDBC.
      SPRING_DATASOURCE_URL: jdbc:postgresql://workshop-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_PROFILES_ACTIVE: production
      # Senha do banco e hash bcrypt da identidade de scrape lidos como arquivos
      # (configtree), nunca por variável de ambiente; o .env não guarda o hash.
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      # Java Agent (OpenTelemetry): jar e javaagent.properties vêm da imagem (/otel).
      # Tirar o -javaagent desliga a instrumentação. OTEL_RESOURCE_ATTRIBUTES não é
      # definido aqui: service.version vem do build e o Collector carimba o ambiente.
      # otel-collector é o Collector de borda (projeto workshop-edge), na rede workshop-metrics.
      JAVA_TOOL_OPTIONS: >-
        -Xms256m -Xmx768m -Duser.timezone=America/Sao_Paulo
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.javaagent.configuration-file=/otel/javaagent.properties
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      TZ: America/Sao_Paulo
    secrets:
      - source: db_password
        target: SPRING_DATASOURCE_PASSWORD
      - source: api_scrape_password_hash
        target: OBSERVABILITY_SCRAPE_PASSWORD_HASH
    volumes:
      - ./config/keys:/app/config/keys:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - workshop-network
      - workshop-ingress
      - workshop-metrics
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  db_data:

secrets:
  db_password:
    file: ./config/secrets/db_password
  pgbackrest_repo:
    file: ./config/secrets/pgbackrest-repo1.conf
  api_scrape_password_hash:
    file: ./config/observability/scrape_password_hash

networks:
  workshop-network:
    name: workshop-network
    driver: bridge
  workshop-ingress:
    name: workshop-ingress
    driver: bridge
  # Scrape de /actuator/prometheus pelo Edge Collector de produção (projeto
  # workshop-edge), que entra nesta rede como externa, e envio de OTLP (traces) da API
  # e do gateway (Caddy) a esse Collector pelo alias otel-collector; sem saída.
  workshop-metrics:
    name: workshop-metrics
    driver: bridge
    internal: true

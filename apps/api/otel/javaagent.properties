# Configuração versionada do OpenTelemetry Java Agent (R5). O agent NÃO lê
# application*.yml; ele lê este arquivo via
#   -Dotel.javaagent.configuration-file=/otel/javaagent.properties
# e as variáveis OTEL_* do processo, que têm precedência sobre este arquivo.
# Por ambiente, informar somente:
#   OTEL_EXPORTER_OTLP_ENDPOINT  (Collector de borda local da VM)
#   OTEL_RESOURCE_ATTRIBUTES     (deployment.environment.name=...,service.version=...)
# service.instance.id é um UUID aleatório gerado pelo agent a cada início
# (identificador técnico efêmero exigido pela política de dados).

otel.service.name=workshop-api
otel.resource.attributes=service.namespace=workshop

otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
# Métricas da API vêm do scrape autenticado de /actuator/prometheus; exportar
# também pelo agent duplicaria as séries.
otel.metrics.exporter=none
# Primeiro corte: logs saem só pelo stdout JSON coletado pelo Alloy; exportar
# pelo agent duplicaria cada linha no Loki.
otel.logs.exporter=none

# Nenhum header HTTP capturado (allowlist vazia) e statements sanitizados;
# o Collector ainda remove db.query.text/db.statement por padrão.
otel.instrumentation.http.server.capture-request-headers=
otel.instrumentation.http.client.capture-request-headers=
otel.instrumentation.common.db.query-sanitization.enabled=true

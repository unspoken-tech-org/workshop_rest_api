plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

// O nome do projeto Gradle mudou para apps:api, mas o artefato público e os
// metadados de build permanecem compatíveis com as versões anteriores.
base {
    archivesName = 'workshop'
}

springBoot {
    buildInfo {
        properties {
            artifact = 'workshop'
            name = 'workshop'
        }
    }
}

processResources {
    // O filtro abaixo não entra no cache do Gradle; sem isto, trocar a versão
    // manteria o application.yml já processado.
    inputs.property('appVersion', project.version.toString())
    filesMatching('**/application*.yml') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
            'project.version': project.version.toString()
        ])
    }
}

java {
    sourceCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// O Spring Boot 3.5 gerencia o rest-assured 5.x e o Groovy 4; o rest-assured 6 precisa do Groovy 5.
ext['rest-assured.version'] = '6.3.0'
ext['groovy.version'] = '5.0.8'
// O Spring Boot 3.5.16 gerencia o Jackson 2.21.4, que tem alertas de segurança corrigidos na 2.21.7.
ext['jackson-bom.version'] = '2.21.8'

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:1.21.4"
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'dev.mccue:guava-base:0.0.4'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'com.github.spullara.mustache.java:compiler:0.9.11'
    implementation 'com.google.guava:guava:33.6.0-jre'
    implementation 'org.simpleflatmapper:sfm-springjdbc:9.0.2'
    implementation 'org.simpleflatmapper:sfm-jdbc:9.0.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation("org.flywaydb:flyway-core:11.11.0")
    implementation("org.flywaydb:flyway-database-postgresql:11.11.0")
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.10.0'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags("integration")
    }
}

tasks.register('integrationTests', Test) {
    group = "tproject"
    description = 'Runs the integration tests.'
    useJUnitPlatform() {
        includeTags("integration")
        excludeTags("unit")
        excludeTags("swagger")
    }
}

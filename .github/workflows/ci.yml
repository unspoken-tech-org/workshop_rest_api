# ===========================================================
# Workflow: Continuous Integration (Test & Security Scans)
# ===========================================================
# Runs unit tests, compiles the application and performs
# vulnerability scanning on repository dependencies using Trivy.
# ===========================================================

name: CI (Build, Test & Security Scan)

on:
  push:
    branches:
      - main
      - 'infra/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # JOB 1: TEST & BUILD
  # ===========================================
  test-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Application JAR
        run: ./gradlew bootJar -x test

  # ===========================================
  # JOB 2: SECURITY SCAN (TRIVY)
  # ===========================================
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test-and-build

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

# ===========================================================
# Workflow: Continuous Integration (Test & Security Scans)
# ===========================================================
# Runs unit tests, compiles the application and performs
# vulnerability scanning on repository dependencies using Trivy.
# ===========================================================

name: CI (Build, Test & Security Scan)

on:
  push:
    branches:
      - main
      - 'infra/**'
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'apps/api/**'
      - 'apps/security/**'
      - 'platform/**'
      - 'environments/local/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/security/**'
      - 'platform/**'
      - 'environments/local/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # JOB 1: TEST & BUILD
  # ===========================================
  test-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Unit Tests
        run: ./gradlew :apps:api:test

      - name: Build Application JAR
        run: ./gradlew :apps:api:bootJar -x test

  # ===========================================
  # JOB 2: SECURITY SCAN (TRIVY)
  # ===========================================
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test-and-build

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

# ===========================================================
# Workflow: Continuous Integration (Test & Security Scans)
# ===========================================================
# Runs unit and integration tests, compiles the application and performs
# vulnerability scanning on repository dependencies using Trivy.
# ===========================================================

name: CI (Build, Test & Security Scan)

on:
  push:
    branches:
      - main
      - 'infra/**'
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
    paths:
      - 'apps/api/**'
      - 'apps/security/**'
      - 'platform/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/**'
      - 'scripts/**'
  # No paths filter on pull_request: the jobs below are required checks on
  # main, and a workflow that does not trigger leaves them stuck as "Expected".
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # JOB 1: TEST & BUILD
  # ===========================================
  test-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Unit Tests
        run: ./gradlew :apps:api:test

      - name: Build Application JAR
        run: ./gradlew :apps:api:bootJar -x test

      # The fs scan in security-scan does not read build.gradle (no lockfile) nor
      # JARs; rootfs on the bootJar sees the libraries actually shipped.
      - name: Trivy scan of the bootJar dependencies (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'rootfs'
          scan-ref: 'apps/api/build/libs'
          scanners: 'vuln'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          exit-code: '1'

  # ===========================================
  # JOB 2: INTEGRATION TESTS (TESTCONTAINERS)
  # ===========================================
  # The hosted runner ships with Docker, which Testcontainers
  # uses to start the PostgreSQL container for the tests.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Integration Tests
        run: ./gradlew :apps:api:integrationTests

  # ===========================================
  # JOB 3: SECURITY SCAN (TRIVY)
  # ===========================================
  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test-and-build
    # security-events: write only here, to upload the SARIF to code scanning.
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Report only: never fails, so the SARIF is always uploaded.
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          exit-code: '0'

      - name: Upload Trivy SARIF to code scanning
        # Fork PRs get a read-only token; skip the upload there.
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

      # Gate: same scan, readable table in the log; findings not accepted in
      # .trivyignore.yaml fail the job. Reuses the Trivy install and DB cache.
      - name: Run Trivy vulnerability scanner (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore.yaml'
          skip-setup-trivy: true
          exit-code: '1'

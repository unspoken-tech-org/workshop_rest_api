# ===========================================================
# Workflow: Observability edge collector on the production VM (PRD)
# ===========================================================
# Independent from the API, gateway and control-plane deployments: every remote
# command is scoped to OBS_PRD_EDGE_DEPLOY_DIR and the workshop-edge project.
#
# - prepare resolves the requested ref to one commit SHA that must be on main;
#   every later job checks out that SHA. A confirmation other than DEPLOY stops
#   here, before any job that holds secrets or reaches the VM.
# - deploy runs in the production-observability Environment (required reviewer,
#   dispatch only from main). It is separate from production, which only allows
#   tags and release/* for the API and gateway.
# - deploy packs the full release (Compose, collector config, .env) into an
#   immutable release directory and switches the active release atomically. The
#   QA OTLP endpoint and the API scrape password travel as files under .secrets/,
#   never in the .env.
# - verify checks the active release again from a fresh job.
# - finalize confirms the release when deploy and verify passed, or restores the
#   previous release when either failed.
#
# The VM is reached through Tailscale (tag:ci) with the host key pinned from
# PROD_SSH_KNOWN_HOSTS, as in deploy-api-prod.yml. The workshop-metrics network
# must already exist on the VM (created by the PRD API Compose); deploy.sh fails
# before switching otherwise. Delivery to QA is not a gate: the PRD -> QA ACL is
# deferred, so the queue may grow until it lands.
# ===========================================================

name: Deploy Observability Edge Collector (PRD)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit containing the edge collector stack'
        required: false
        default: 'main'
      confirm:
        description: 'Confirm deployment of the observability edge collector on the PRD VM'
        type: choice
        required: true
        default: 'CANCEL'
        options:
          - DEPLOY
          - CANCEL

permissions:
  contents: read

concurrency:
  group: deploy-observability-edge-prod
  cancel-in-progress: false

env:
  OBS_PRD_EDGE_DEPLOY_DIR: ${{ vars.OBS_PRD_EDGE_DEPLOY_DIR || '/home/workshop/deploy/observability_edge_prd' }}
  OBS_PRD_EDGE_COMPOSE_FILE: docker-compose-observability-edge-prd.yml
  OBS_PRD_EDGE_COMPOSE_PROJECT_NAME: workshop-edge
  OBS_PRD_EDGE_COMPOSE_SOURCE: platform/observability/edge/compose.yml
  # PRD API container on the workshop-metrics network (container_name workshop-api,
  # port 8080, as in apps/api/compose/production.yml). Overridable by variable.
  API_SCRAPE_TARGET: ${{ vars.OBS_PRD_API_SCRAPE_TARGET || 'workshop-api:8080' }}
  # Read-only scrape identity, the same one the QA Prometheus uses.
  API_SCRAPE_USERNAME: metrics-scraper
  # 96 MiB per signal (~6 h of metrics at ~15 MB/h). The VM checks free disk
  # against 3 x this value.
  COLLECTOR_QUEUE_BYTES: '100663296'

jobs:
  prepare:
    name: Prepare edge deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      release-id: ${{ steps.resolve.outputs.release-id }}

    steps:
      - name: Require DEPLOY confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "${CONFIRM}" == DEPLOY ]] || {
            echo "Deployment cancelled: confirmation was not DEPLOY" >&2
            exit 1
          }

      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout requested ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable commit
        id: resolve
        run: |
          set -Eeuo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "${sha}" =~ ^[0-9a-f]{40}$ ]]
          # The approval covers what is on main, not an arbitrary branch.
          git merge-base --is-ancestor "${sha}" origin/main || {
            echo "Commit ${sha} is not on main" >&2
            exit 1
          }
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "release-id=${sha:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "Deploying commit ${sha}"

      - name: Validate deployment contract
        env:
          DEPLOY_DIR: ${{ env.OBS_PRD_EDGE_DEPLOY_DIR }}
          COMPOSE_SOURCE: ${{ env.OBS_PRD_EDGE_COMPOSE_SOURCE }}
          COMPOSE_PROJECT_NAME: ${{ env.OBS_PRD_EDGE_COMPOSE_PROJECT_NAME }}
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_DIR}" =~ ^/[A-Za-z0-9._/-]+$ && "${DEPLOY_DIR}" != *..* ]] || {
            echo "OBS_PRD_EDGE_DEPLOY_DIR must be an absolute, shell-safe path" >&2
            exit 1
          }
          [[ "${DEPLOY_DIR}" == *observability*edge* ]] || {
            echo "OBS_PRD_EDGE_DEPLOY_DIR must be a dedicated edge path" >&2
            exit 1
          }
          [[ "${DEPLOY_DIR}" != *api* && "${DEPLOY_DIR}" != *gateway* ]] || {
            echo "OBS_PRD_EDGE_DEPLOY_DIR cannot overlap API or gateway" >&2
            exit 1
          }
          [[ "${API_SCRAPE_TARGET}" =~ ^[A-Za-z0-9._-]+:[0-9]{1,5}$ ]] || {
            echo "OBS_PRD_API_SCRAPE_TARGET must be host:port" >&2
            exit 1
          }
          for script in common deploy verify rollback cleanup; do
            test -s ".github/scripts/observability-edge/${script}.sh"
          done
          test -s "${COMPOSE_SOURCE}"
          # Interpolation check only: placeholders, no credentials in a file.
          env \
            QA_OTLP_ENDPOINT=100.64.0.1:4317 \
            API_SCRAPE_TARGET="${API_SCRAPE_TARGET}" \
            EDGE_API_SCRAPE_PASSWORD_FILE=/nonexistent/api-scrape-password \
            docker compose \
              --project-directory . \
              -p "${COMPOSE_PROJECT_NAME}" \
              -f "${COMPOSE_SOURCE}" \
              config --quiet

      - name: Print deployment banner
        uses: ./.github/actions/shared/print-banner
        with:
          prefix: OBSERVABILITY-EDGE-PRD
          image-tag: ${{ steps.resolve.outputs.sha }}

  deploy:
    name: Deploy release to the PRD VM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    environment: production-observability
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout resolved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Prepare release environment
        env:
          API_SCRAPE_PASSWORD: ${{ secrets.OBS_PRD_API_SCRAPE_PASSWORD }}
          QA_OTLP_ENDPOINT: ${{ secrets.OBS_QA_OTLP_ENDPOINT }}
        run: |
          set -Eeuo pipefail
          for variable in \
            API_SCRAPE_PASSWORD QA_OTLP_ENDPOINT \
            API_SCRAPE_TARGET API_SCRAPE_USERNAME COLLECTOR_QUEUE_BYTES; do
            [[ -n "${!variable:-}" ]] || {
              echo "Missing required ${variable} value" >&2
              exit 1
            }
          done
          [[ "${QA_OTLP_ENDPOINT}" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{1,5}$ ]] || {
            echo "OBS_QA_OTLP_ENDPOINT must be the QA Tailscale IP with the OTLP port" >&2
            exit 1
          }
          [[ "${API_SCRAPE_PASSWORD}" != *$'\n'* && "${API_SCRAPE_PASSWORD}" != *$'\r'* ]] || {
            echo "OBS_PRD_API_SCRAPE_PASSWORD must be a single line" >&2
            exit 1
          }
          [[ "${COLLECTOR_QUEUE_BYTES}" =~ ^[1-9][0-9]*$ ]] || {
            echo "COLLECTOR_QUEUE_BYTES must be a positive integer" >&2
            exit 1
          }
          echo "::add-mask::${API_SCRAPE_PASSWORD}"
          echo "::add-mask::${QA_OTLP_ENDPOINT}"

          umask 077
          # Non-secret settings only: the .env travels in the release, the
          # secrets below travel as files.
          {
            printf 'API_SCRAPE_TARGET=%s\n' "${API_SCRAPE_TARGET}"
            printf 'API_SCRAPE_USERNAME=%s\n' "${API_SCRAPE_USERNAME}"
            printf 'COLLECTOR_QUEUE_BYTES=%s\n' "${COLLECTOR_QUEUE_BYTES}"
          } > "${RUNNER_TEMP}/observability-edge.env"
          # Compose only accepts file secrets for these services, and the
          # scrape password is read by a non-root container user, so the
          # files are written 600 here and made 444 inside the release.
          secrets_dir="${RUNNER_TEMP}/observability-edge-secrets"
          rm -rf -- "${secrets_dir}"
          mkdir -m 700 -- "${secrets_dir}"
          printf '%s' "${API_SCRAPE_PASSWORD}" > "${secrets_dir}/api-scrape-password"
          printf '%s' "${QA_OTLP_ENDPOINT}" > "${secrets_dir}/qa-otlp-endpoint"

      - name: Require pinned host key
        env:
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          TAILSCALE_IP: ${{ secrets.TS_TAILSCALE_IP }}
        run: |
          set -Eeuo pipefail
          [[ -n "${KNOWN_HOSTS}" ]] || {
            echo "PROD_SSH_KNOWN_HOSTS is required" >&2
            exit 1
          }
          [[ "${TAILSCALE_IP}" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || {
            echo "TS_TAILSCALE_IP must be a Tailscale IP" >&2
            exit 1
          }

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.PRD_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRD_TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.TS_TAILSCALE_IP }}

      - name: Setup SSH Known Hosts
        uses: ./.github/actions/shared/setup-ssh-known-hosts
        with:
          host: ${{ secrets.TS_TAILSCALE_IP }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Deploy edge release
        uses: ./.github/actions/observability-edge/deploy-via-ssh-observability-edge
        with:
          ssh-target: ${{ secrets.PROD_SSH_USER }}@${{ secrets.TS_TAILSCALE_IP }}
          deploy-dir: ${{ env.OBS_PRD_EDGE_DEPLOY_DIR }}
          compose-file: ${{ env.OBS_PRD_EDGE_COMPOSE_FILE }}
          compose-project-name: ${{ env.OBS_PRD_EDGE_COMPOSE_PROJECT_NAME }}
          compose-source: ${{ env.OBS_PRD_EDGE_COMPOSE_SOURCE }}
          release-id: ${{ needs.prepare.outputs.release-id }}
          env-file: ${{ runner.temp }}/observability-edge.env
          secrets-dir: ${{ runner.temp }}/observability-edge-secrets

      - name: Remove local release environment
        if: always()
        run: |
          rm -rf -- "${RUNNER_TEMP}/observability-edge.env" \
            "${RUNNER_TEMP}/observability-edge-secrets"

  verify:
    name: Verify active release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, deploy]
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout resolved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Require pinned host key
        env:
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          TAILSCALE_IP: ${{ secrets.TS_TAILSCALE_IP }}
        run: |
          set -Eeuo pipefail
          [[ -n "${KNOWN_HOSTS}" ]] || {
            echo "PROD_SSH_KNOWN_HOSTS is required" >&2
            exit 1
          }
          [[ "${TAILSCALE_IP}" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || {
            echo "TS_TAILSCALE_IP must be a Tailscale IP" >&2
            exit 1
          }

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.PRD_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRD_TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.TS_TAILSCALE_IP }}

      - name: Setup SSH Known Hosts
        uses: ./.github/actions/shared/setup-ssh-known-hosts
        with:
          host: ${{ secrets.TS_TAILSCALE_IP }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Verify edge collector
        env:
          SSH_TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.TS_TAILSCALE_IP }}
          DEPLOY_DIR: ${{ env.OBS_PRD_EDGE_DEPLOY_DIR }}
          COMPOSE_FILE: ${{ env.OBS_PRD_EDGE_COMPOSE_FILE }}
          COMPOSE_PROJECT_NAME: ${{ env.OBS_PRD_EDGE_COMPOSE_PROJECT_NAME }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o ConnectTimeout=30 -o StrictHostKeyChecking=yes)
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "umask 077 && mkdir -p '${DEPLOY_DIR}/.tmp' && chmod 700 '${DEPLOY_DIR}/.tmp'"
          scp "${ssh_opts[@]}" \
            .github/scripts/observability-edge/common.sh \
            .github/scripts/observability-edge/verify.sh \
            "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/"
          status=0
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            env \
              DEPLOY_DIR="${DEPLOY_DIR}" \
              COMPOSE_FILE="${COMPOSE_FILE}" \
              COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}" \
              RELEASE_ID="${RELEASE_ID}" \
              bash "${DEPLOY_DIR}/.tmp/verify.sh" || status=$?
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "rm -f '${DEPLOY_DIR}/.tmp/verify.sh' '${DEPLOY_DIR}/.tmp/common.sh'" || true
          exit "${status}"

  finalize:
    name: Confirm or roll back release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare, deploy, verify]
    # Never runs when prepare failed or the confirmation was CANCEL.
    if: always() && needs.prepare.result == 'success'
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout resolved commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Require pinned host key
        env:
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          TAILSCALE_IP: ${{ secrets.TS_TAILSCALE_IP }}
        run: |
          set -Eeuo pipefail
          [[ -n "${KNOWN_HOSTS}" ]] || {
            echo "PROD_SSH_KNOWN_HOSTS is required" >&2
            exit 1
          }
          [[ "${TAILSCALE_IP}" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || {
            echo "TS_TAILSCALE_IP must be a Tailscale IP" >&2
            exit 1
          }

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.PRD_TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRD_TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.TS_TAILSCALE_IP }}

      - name: Setup SSH Known Hosts
        uses: ./.github/actions/shared/setup-ssh-known-hosts
        with:
          host: ${{ secrets.TS_TAILSCALE_IP }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}

      - name: Roll back to the previous release
        if: needs.deploy.result != 'success' || needs.verify.result != 'success'
        env:
          SSH_TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.TS_TAILSCALE_IP }}
          DEPLOY_DIR: ${{ env.OBS_PRD_EDGE_DEPLOY_DIR }}
          COMPOSE_FILE: ${{ env.OBS_PRD_EDGE_COMPOSE_FILE }}
          COMPOSE_PROJECT_NAME: ${{ env.OBS_PRD_EDGE_COMPOSE_PROJECT_NAME }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o ConnectTimeout=30 -o StrictHostKeyChecking=yes)
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "umask 077 && mkdir -p '${DEPLOY_DIR}/.tmp' && chmod 700 '${DEPLOY_DIR}/.tmp'"
          scp "${ssh_opts[@]}" \
            .github/scripts/observability-edge/common.sh \
            .github/scripts/observability-edge/rollback.sh \
            "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/"
          status=0
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            env \
              DEPLOY_DIR="${DEPLOY_DIR}" \
              COMPOSE_FILE="${COMPOSE_FILE}" \
              COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}" \
              RELEASE_ID="${RELEASE_ID}" \
              bash "${DEPLOY_DIR}/.tmp/rollback.sh" || status=$?
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "rm -f '${DEPLOY_DIR}/.tmp/rollback.sh' '${DEPLOY_DIR}/.tmp/common.sh'" || true
          exit "${status}"

      - name: Confirm release and prune old ones
        if: needs.deploy.result == 'success' && needs.verify.result == 'success'
        env:
          SSH_TARGET: ${{ secrets.PROD_SSH_USER }}@${{ secrets.TS_TAILSCALE_IP }}
          DEPLOY_DIR: ${{ env.OBS_PRD_EDGE_DEPLOY_DIR }}
          COMPOSE_FILE: ${{ env.OBS_PRD_EDGE_COMPOSE_FILE }}
          COMPOSE_PROJECT_NAME: ${{ env.OBS_PRD_EDGE_COMPOSE_PROJECT_NAME }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          set -Eeuo pipefail
          ssh_opts=(-o ConnectTimeout=30 -o StrictHostKeyChecking=yes)
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "umask 077 && mkdir -p '${DEPLOY_DIR}/.tmp' && chmod 700 '${DEPLOY_DIR}/.tmp'"
          scp "${ssh_opts[@]}" \
            .github/scripts/observability-edge/common.sh \
            .github/scripts/observability-edge/cleanup.sh \
            "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/"
          status=0
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            env \
              DEPLOY_DIR="${DEPLOY_DIR}" \
              COMPOSE_FILE="${COMPOSE_FILE}" \
              COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME}" \
              RELEASE_ID="${RELEASE_ID}" \
              bash "${DEPLOY_DIR}/.tmp/cleanup.sh" || status=$?
          # shellcheck disable=SC2029  # values are validated above and expanded on the runner on purpose
          ssh "${ssh_opts[@]}" "${SSH_TARGET}" \
            "rm -f '${DEPLOY_DIR}/.tmp/cleanup.sh' '${DEPLOY_DIR}/.tmp/common.sh'" || true
          exit "${status}"

      - name: Print final banner
        if: needs.deploy.result == 'success' && needs.verify.result == 'success'
        uses: ./.github/actions/shared/print-banner
        with:
          prefix: OBSERVABILITY-EDGE-PRD
          image-tag: ${{ needs.prepare.outputs.sha }}

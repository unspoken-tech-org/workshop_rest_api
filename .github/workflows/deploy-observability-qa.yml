# ARCHIVED: legacy QA observability deployment.
#
# The active deployment is deploy-observability-control-plane-qa.yml. This
# compatibility stub intentionally has no remote steps, no secrets and no
# access to API/gateway QA stacks. Keep the filename to make the retirement
# explicit in Git history and in existing links.

name: '[Archived] Deploy Observability (QA) legacy'

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'This legacy workflow is archived; no deployment is performed'
        required: true
        type: choice
        default: 'ARCHIVED'
        options:
          - ARCHIVED

permissions:
  contents: read

jobs:
  archived:
    name: Archived — no deployment
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Legacy observability QA workflow archived; use deploy-observability-control-plane-qa.yml.'

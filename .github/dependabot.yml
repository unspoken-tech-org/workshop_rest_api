version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/apps/api/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    ignore:
      # Major do Postgres exige pg_upgrade/dump-restore e muda o PGDATA; migração planejada.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Mantém o Java no LTS em uso (25).
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/platform/gateway/caddy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "gradle"
    open-pull-requests-limit: 5
    ignore:
      # springdoc 3.x exige Spring Boot 4; liberar junto com a migração do Boot.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]

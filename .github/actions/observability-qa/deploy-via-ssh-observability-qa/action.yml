name: Archived Observability QA SSH Deploy
description: >
  Retired compatibility action. The legacy observability QA deployment is
  archived; use the dedicated control-plane workflow instead.

runs:
  using: composite
  steps:
    - name: Refuse archived deployment
      shell: bash
      run: |
        echo 'The legacy observability QA SSH action is archived; no remote action was taken.' >&2
        exit 1

name: Deploy API via SSH
description: >
  Prepares .env + JWT keys on the runner, scps to the server and runs deploy.sh.
  Used exclusively by the `deploy-api-prod.yml` pipeline (Spring Boot API in production).
  Requires Setup Tailscale executed previously in the job (depends on WireGuard tunnel).

inputs:
  ssh-target:
    description: 'SSH target in the user@host format'
    required: true
  deploy-dir:
    description: 'Deploy directory on the server'
    required: true
  registry:
    description: 'Docker registry (e.g., ghcr.io)'
    required: true
  image-name:
    description: 'Full image name in the registry (e.g., org/repo)'
    required: true
  local-image-name:
    description: 'Local image name generated by docker compose'
    required: true
  compose-file:
    description: 'docker-compose file name on the server'
    required: true
  compose-source:
    description: 'Path to the compose file in the checked-out repository'
    required: true
  image-tag:
    description: 'Image tag to be deployed'
    required: true
  image-digest:
    description: 'Digest (sha256:...) of the image built for this deploy'
    required: true
  deploy-script:
    description: 'Path to deploy.sh in the repository'
    required: true
  db-name:
    description: 'PostgreSQL database name'
    required: true
  db-username:
    description: 'Database user'
    required: true
  db-password:
    description: 'Database password'
    required: true
  admin-email:
    description: 'Application admin email'
    required: true
  jwt-private-b64:
    description: 'RSA private key in base64'
    required: true
  jwt-public-b64:
    description: 'RSA public key in base64'
    required: true
  pgbackrest-s3-bucket:
    description: 'pgBackRest S3 bucket name'
    required: true
  pgbackrest-s3-endpoint:
    description: 'pgBackRest S3 endpoint URL'
    required: true
  pgbackrest-s3-region:
    description: 'pgBackRest S3 region'
    required: true
  pgbackrest-s3-key:
    description: 'pgBackRest S3 access key ID'
    required: true
  pgbackrest-s3-key-secret:
    description: 'pgBackRest S3 secret access key'
    required: true
  scrape-password-hash:
    description: 'Bcrypt hash of the /actuator/prometheus scrape identity'
    required: true
  healthchecks-backup-full-url:
    description: 'Healthchecks ping URL of the weekly full backup'
    required: true
  healthchecks-backup-diff-url:
    description: 'Healthchecks ping URL of the daily diff backup'
    required: true

runs:
  using: composite
  steps:
    - name: Prepare deploy files on runner
      shell: bash
      env:
        DB_NAME: ${{ inputs.db-name }}
        DB_USERNAME: ${{ inputs.db-username }}
        DB_PASSWORD: ${{ inputs.db-password }}
        ADMIN_EMAIL: ${{ inputs.admin-email }}
        JWT_PRIVATE_KEY: ${{ inputs.jwt-private-b64 }}
        JWT_PUBLIC_KEY: ${{ inputs.jwt-public-b64 }}
        PGBACKREST_S3_BUCKET: ${{ inputs.pgbackrest-s3-bucket }}
        PGBACKREST_S3_ENDPOINT: ${{ inputs.pgbackrest-s3-endpoint }}
        PGBACKREST_S3_REGION: ${{ inputs.pgbackrest-s3-region }}
        PGBACKREST_S3_KEY: ${{ inputs.pgbackrest-s3-key }}
        PGBACKREST_S3_KEY_SECRET: ${{ inputs.pgbackrest-s3-key-secret }}
        SCRAPE_PASSWORD_HASH: ${{ inputs.scrape-password-hash }}
        HC_BACKUP_FULL_URL: ${{ inputs.healthchecks-backup-full-url }}
        HC_BACKUP_DIFF_URL: ${{ inputs.healthchecks-backup-diff-url }}
      run: |
        set -e

        # Without the hash the API denies every scrape; fail before the server.
        [[ "${SCRAPE_PASSWORD_HASH}" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]] || {
          echo "scrape-password-hash must be a bcrypt hash" >&2
          exit 1
        }

        # Only non-secret values; secrets go to the files below.
        {
          echo "DB_NAME=${DB_NAME}"
          echo "DB_USERNAME=${DB_USERNAME}"
          echo "ADMIN_EMAIL=${ADMIN_EMAIL}"
        } > /tmp/.env
        chmod 600 /tmp/.env

        echo "${JWT_PRIVATE_KEY}" | base64 -d > /tmp/private-pkcs8.pem
        echo "${JWT_PUBLIC_KEY}" | base64 -d > /tmp/public.pem
        chmod 600 /tmp/private-pkcs8.pem
        chmod 644 /tmp/public.pem

        ( umask 077 && printf '%s' "${SCRAPE_PASSWORD_HASH}" > /tmp/scrape_password_hash )

        # Backup ping URLs carry the check token: file secrets, never in the crontab.
        for url in "${HC_BACKUP_FULL_URL}" "${HC_BACKUP_DIFF_URL}"; do
          if [[ ! "${url}" =~ ^https://[^[:space:]]+$ ]]; then
            echo "healthchecks-backup-*-url must be a single-line https URL" >&2
            exit 1
          fi
        done
        ( umask 077 && printf '%s' "${HC_BACKUP_FULL_URL}" > /tmp/healthchecks-backup-full-url \
          && printf '%s' "${HC_BACKUP_DIFF_URL}" > /tmp/healthchecks-backup-diff-url )

        # DB password and pgBackRest repository reach the containers as files,
        # never as container env (the edge containers collector reads inspect).
        for value in "${DB_PASSWORD}" "${PGBACKREST_S3_BUCKET}" "${PGBACKREST_S3_ENDPOINT}" \
          "${PGBACKREST_S3_REGION}" "${PGBACKREST_S3_KEY}" "${PGBACKREST_S3_KEY_SECRET}"; do
          [[ -n "${value}" && "${value}" != *$'\n'* && "${value}" != *$'\r'* ]] || {
            echo "database and pgBackRest secrets must be non-empty single-line values" >&2
            exit 1
          }
        done
        ( umask 077 && printf '%s' "${DB_PASSWORD}" > /tmp/db_password )
        (
          umask 077
          {
            echo "[global]"
            echo "repo1-type=s3"
            echo "repo1-s3-bucket=${PGBACKREST_S3_BUCKET}"
            echo "repo1-s3-endpoint=${PGBACKREST_S3_ENDPOINT}"
            echo "repo1-s3-region=${PGBACKREST_S3_REGION}"
            echo "repo1-s3-key=${PGBACKREST_S3_KEY}"
            echo "repo1-s3-key-secret=${PGBACKREST_S3_KEY_SECRET}"
          } > /tmp/pgbackrest-repo1.conf
        )

        echo "Deploy files prepared:"
        ls -la /tmp/.env /tmp/private-pkcs8.pem /tmp/public.pem /tmp/scrape_password_hash \
          /tmp/db_password /tmp/pgbackrest-repo1.conf \
          /tmp/healthchecks-backup-full-url /tmp/healthchecks-backup-diff-url

    - name: Upload files to server
      shell: bash
      env:
        SSH_TARGET: ${{ inputs.ssh-target }}
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
        DEPLOY_SCRIPT: ${{ inputs.deploy-script }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        COMPOSE_SOURCE: ${{ inputs.compose-source }}
      run: |
        set -e

        # Materialize a server-shaped payload. The checked-out compose file lives under
        # apps/api, while the production host keeps Dockerfile.pgbackrest at its root.
        test -s "${COMPOSE_SOURCE}"
        test -s "apps/api/infra/pgbackrest/pgbackrest.conf"
        test -s "apps/api/infra/pgbackrest/backup.sh"
        test -s "apps/api/infra/pgbackrest/backup.crontab"
        test -s "apps/api/docker/Dockerfile.pgbackrest"
        PAYLOAD_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/api-prod-payload.XXXXXX")"
        COMPOSE_PAYLOAD="${PAYLOAD_ROOT}/${COMPOSE_FILE}"
        sed 's#apps/api/docker/Dockerfile.pgbackrest#Dockerfile.pgbackrest#g' \
          "${COMPOSE_SOURCE}" > "${COMPOSE_PAYLOAD}"

        # Parse the payload with representative values before changing the server.
        mkdir -p "${PAYLOAD_ROOT}/config/keys" "${PAYLOAD_ROOT}/config/observability" \
          "${PAYLOAD_ROOT}/config/secrets"
        printf '%s' 'validation-only' > "${PAYLOAD_ROOT}/config/observability/scrape_password_hash"
        printf '%s' 'validation-only' > "${PAYLOAD_ROOT}/config/secrets/db_password"
        printf '%s' 'validation-only' > "${PAYLOAD_ROOT}/config/secrets/pgbackrest-repo1.conf"
        touch "${PAYLOAD_ROOT}/Dockerfile.pgbackrest"
        printf '%s\n' \
          'DB_NAME=workshop_db' \
          'DB_USERNAME=workshop_admin' > "${PAYLOAD_ROOT}/.env"
        docker compose --project-directory "${PAYLOAD_ROOT}" \
          --env-file "${PAYLOAD_ROOT}/.env" \
          -f "${COMPOSE_PAYLOAD}" config --quiet

        # Ensure deploy directory, secure tmp directory, and docker config directory exist on the server
        ssh -o ConnectTimeout=30 \
          "${SSH_TARGET}" "mkdir -p '${DEPLOY_DIR}/.tmp/docker' && chmod 700 '${DEPLOY_DIR}/.tmp' '${DEPLOY_DIR}/.tmp/docker'"

        ssh -o ConnectTimeout=30 \
          "${SSH_TARGET}" "mkdir -p /srv/pgbackrest/conf /srv/pgbackrest/repo /srv/pgbackrest/logs && (chmod 755 /srv/pgbackrest/conf || true) && (chmod 777 /srv/pgbackrest/repo /srv/pgbackrest/logs || true)"

        mkdir -p ~/.docker
        chmod 700 ~/.docker

        scp -o ConnectTimeout=30 \
          /tmp/.env /tmp/private-pkcs8.pem /tmp/public.pem /tmp/scrape_password_hash \
          /tmp/db_password /tmp/pgbackrest-repo1.conf \
          /tmp/healthchecks-backup-full-url /tmp/healthchecks-backup-diff-url \
          "${DEPLOY_SCRIPT}" \
          "apps/api/infra/pgbackrest/pgbackrest.conf" \
          "apps/api/infra/pgbackrest/backup.sh" \
          "apps/api/infra/pgbackrest/backup.crontab" \
          "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/"

        # Stage the compose file; deploy.sh snapshots the current one before swapping
        scp -o ConnectTimeout=30 \
          "${COMPOSE_PAYLOAD}" \
          "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/${COMPOSE_FILE}"

        # Upload Dockerfile for PostgreSQL image build (first deploy only)
        scp -o ConnectTimeout=30 \
          "apps/api/docker/Dockerfile.pgbackrest" \
          "${SSH_TARGET}:${DEPLOY_DIR}/Dockerfile.pgbackrest"

        scp -o ConnectTimeout=30 \
          "${HOME}/.docker/config.json" \
          "${SSH_TARGET}:${DEPLOY_DIR}/.tmp/docker/config.json"

        echo "Files uploaded to ${SSH_TARGET}:${DEPLOY_DIR}/.tmp/"

    - name: Execute deploy on server
      shell: bash
      env:
        SSH_TARGET: ${{ inputs.ssh-target }}
        DEPLOY_DIR: ${{ inputs.deploy-dir }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
        LOCAL_IMAGE_NAME: ${{ inputs.local-image-name }}
        COMPOSE_FILE: ${{ inputs.compose-file }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        DEPLOY_RUN_ID: ${{ github.run_id }}
      run: |
        set -e

        ssh -o ConnectTimeout=30 \
          "${SSH_TARGET}" \
          env DEPLOY_DIR="${DEPLOY_DIR}" \
              REGISTRY="${REGISTRY}" \
              IMAGE_NAME="${IMAGE_NAME}" \
              LOCAL_IMAGE_NAME="${LOCAL_IMAGE_NAME}" \
              COMPOSE_FILE="${COMPOSE_FILE}" \
              IMAGE_TAG="${IMAGE_TAG}" \
              IMAGE_DIGEST="${IMAGE_DIGEST}" \
              DEPLOY_RUN_ID="${DEPLOY_RUN_ID}" \
              bash "${DEPLOY_DIR}/.tmp/deploy.sh"

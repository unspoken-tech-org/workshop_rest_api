name: Archived Observability Production SSH Deploy
description: >
  Retired compatibility action. The legacy production observability
  deployment is archived and has no remote lifecycle operations.

runs:
  using: composite
  steps:
    - name: Refuse archived deployment
      shell: bash
      run: |
        echo 'The legacy observability production SSH action is archived; no remote action was taken.' >&2
        exit 1

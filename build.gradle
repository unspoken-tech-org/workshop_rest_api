import org.gradle.api.tasks.testing.Test

plugins {
    id 'base'
}

group = 'com.tproject'
version = '1.3.1'

subprojects {
    group = rootProject.group
    version = rootProject.version
}

// O projeto raiz é o ponto de entrada do monorepo. Os aliases de ciclo de vida
// agregam os módulos, e as tarefas tipadas de teste continuam aceitando
// opções Gradle como --tests.
tasks.named('build') {
    dependsOn(':apps:api:build', ':apps:security:build')
}

tasks.named('clean') {
    dependsOn(':apps:api:clean', ':apps:security:clean')
}

tasks.register('test', Test) {
    group = 'verification'
    description = 'Executa os testes unitários de todos os módulos.'
    // A raiz não possui fontes próprias; a tarefa existe para agregar os
    // módulos e ainda aceitar --tests sem falhar na configuração.
    testClassesDirs = files()
    classpath = files()
    dependsOn(':apps:api:test', ':apps:security:test')
}

tasks.register('integrationTests', Test) {
    group = 'verification'
    description = 'Executa os testes de integração da API.'
    testClassesDirs = files()
    classpath = files()
    dependsOn(':apps:api:integrationTests')
}

tasks.register('bootJar') {
    group = 'build'
    description = 'Gera o Boot JAR da API.'
    dependsOn(':apps:api:bootJar')
}
